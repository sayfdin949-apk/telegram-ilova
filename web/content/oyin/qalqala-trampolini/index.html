function clip(k,gain,delay,tag){

 var c=getAC();
 window.__log.push({e:'clip',k:k,g:gain,d:delay||0,tag:tag||''});
 if(!c){var a=new Audio(AU[k]);a.volume=Math.min(1,gain);setTimeout(function(){a.play().catch(function(){});},(delay||0)*kf());a.onended=function(){window.__ended++};return}

  var s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=gain;s.connect(g);g.connect(c.destination);
  s.onended=function(){window.__ended++};
  s.start(c.currentTime+(delay||0)*kf())})}

 if(S.mute)return;var c=getAC();if(!c)return;
 try{var t=c.currentTime+(delay||0)*kf(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);

  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur*kf()+.05)}catch(e){}}

 else if(kind==='boing'){tone(260,620,.2,.07);}
 else if(kind==='thud')tone(95,45,.26,.14);

 else if(kind==='good'){tone(660,660,.3,.05,'sine',.0);tone(880,880,.35,.05,'sine',.13)}

  '<ellipse cx="300" cy="398" rx="158" ry="28" fill="#B98B55" stroke="#8E6738" stroke-width="2.5"/>'+

 '</g>'+

function geom(){
 var sc=$('#scene');if(!sc)return null;var r=sc.getBoundingClientRect(),s=r.width/600;

  var e=document.createElementNS(NS,'ellipse');e.setAttribute('cx',300);e.setAttribute('cy',394);e.setAttribute('rx',Math.round(250-i*30));e.setAttribute('ry',Math.round(42-i*5));

window.__api={S:S,ITEMS:ITEMS};
/*__PART2__*/

/* 2: o'yin dvigateli (vaqt — virtual ms; window.__K tezlatadi) */
var FIVE_TXT=FIVE.map(function(f){return f.tok}).join(' ');
function fallMs(i){var n=Math.max(1,S.queue.length-1);return lerp(3400,1650,Math.min(1,i/n))}

 S.fb={cls:cls,icon:icon,title:title,html:html};drawFb()}
function drawFb(){
 var f=$('#fb');if(!f)return;
 if(!S.fb){f.className='fb';f.innerHTML='<span class="fi">'+ico('info')+'</span><span>Harf trampolinga tushmoqda. Qalqala harfi bo‘lsa — <b>Sakra</b>, bo‘lmasa — <b>Jim</b>.</span>';return}
 f.className='fb '+S.fb.cls;f.innerHTML='<span class="fi">'+ico(S.fb.icon)+'</span><span><span class="tt">'+S.fb.title+'</span>'+S.fb.html+'</span>'}
function drawHud(){
 var d=$('#dots');if(!d)return;
 var h='';for(var i=0;i<S.queue.length;i++){var r=S.res[S.queue[i]],c=r.st===true?'ok':(r.st===false?'no':((i===S.qi&&S.ph!=='idle')?'cur':''));h+='<b class="'+c+'"></b>'}

 $('#step').textContent=Math.min(S.queue.length,S.qi+1)+' / '+S.queue.length;
 $('#score').textContent=S.score;var cb=$('#combo');if(cb)cb.textContent='×'+S.combo;
 var sp=S.queue.length>1?S.qi/(S.queue.length-1):0;document.documentElement.style.setProperty('--sp',S.calm?0:sp.toFixed(2));
 var j=$('[data-act="jump"]'),s=$('[data-act="soft"]');

 if(j&&s){j.disabled=!can;s.disabled=!can;j.classList.toggle('press',S.dec==='jump');s.classList.toggle('press',S.dec==='soft');j.setAttribute('aria-pressed',S.dec==='jump');s.setAttribute('aria-pressed',S.dec==='soft')}

function spawn(){

function step(dt){

 var p;

  var by=S.yTo+(RM?0:Math.sin(S.t/320)*4);setTok(by,1,1,0,0);return}

function decide(kind){

  var g=geom();S.yFrom=S.yTo;S.yTo=g.land;
  if(RM){land();return}
  S.ph='fall';S.t=0;S.T=420;S.calmFall=true;drawHud()}}

function land(){
 var it=curItem(),qal=it.qal,jump=S.dec==='jump',kind;
 if(qal&&jump)kind='gj';else if(!qal&&!jump)kind='gs';else if(qal)kind='miss';else kind='bad';
 var good=(kind==='gj'||kind==='gs'),ex='';
 S.out=kind;S.ph='resolve';S.t=0;S.R=(kind==='gj')?1550:1100;S.hit=[false,false,false];
 var r=S.res[S.queue[S.qi]];r.st=good;
 if(good){S.score+=10;S.combo++;if(S.combo>S.best)S.best=S.combo;
  if(kind==='gj'&&!S.calm&&S.decP>=.6){S.score+=5;S.aniq++;r.aniq=true;ex=' <b>Aniq vaqtda!</b>'}}
 else S.combo=0;
 var tok=$('#tok');if(tok)tok.classList.add(good?'good':'bad');
 var tk=$('#tok .mk');if(tk)tk.innerHTML=ico(good?'check':'x');
 var a=ar(it.tok);
 if(kind==='gj'){setFb('ok','check','To‘g‘ri — sapchidi!',a+' qalqala harfi: sukunda tovush ‘sapchiydi’, aks-sado eshitildi.'+ex)}
 else if(kind==='gs'){setFb('ok','check','To‘g‘ri — yumshoq qo‘ndi.',a+' qalqala harfi emas ('+ar(FIVE_TXT)+'), shuning uchun sukunda sapchimaydi.')}
 else if(kind==='miss'){setFb('no','x',S.dec==='soft'?'Sapchishi kerak edi.':'Vaqt o‘tib ketdi.',a+' — qalqala harfi: sukunda tovush ‘sapchiydi’. Keyingisida <b>Sakra</b> ni bosing.')}
 else{setFb('no','x','Bu harf sapchimaydi.',a+' qalqala harfi emas ('+ar(FIVE_TXT)+'). Trampolin tayyor edi, lekin tovush sapchimaydi — <b>Jim</b> kerak edi.')}
 var live=$('#live');if(live)live.textContent=(good?'To‘g‘ri. ':'Xato. ')+it.ar;
 /* ovoz: egasi yozuvi; qalqala sapchiganda — o'sha yozuvning aks-sadosi */
 clip(it.klip,1,0,kind);
 if(kind==='gj'){clip(it.klip,.38,.55,'echo');clip(it.klip,.18,.89,'echo');sfx('boing');setTimeout(function(){sfx('good')},700*kf())}
 else if(kind==='gs'){sfx('soft');setTimeout(function(){sfx('good')},500*kf())}
 else if(kind==='miss'){sfx('soft');setTimeout(function(){sfx('bad')},400*kf())}
 else{sfx('thud');setTimeout(function(){sfx('bad')},400*kf())}
 if(!RM){matAnim(kind==='gj'?'dip':(kind==='bad'?'thud':'soft'));if(kind==='gj')echoRings(3)}
 drawHud();anim(geom(),true)}

function anim(g,first){
 var t=S.t,k=S.out,L=g.land,hmax=Math.max(60,L-g.H*.1);
 if(RM){setTok(k==='gj'?L-hmax*.45:L,1,1,0,0);if(S.t>=S.R+200){S.ph='fade';S.t=0;var o=$('#tok');if(o)o.classList.add('fade')}return}
 var y=L,sx=1,sy=1,rot=0,x=0;
 if(k==='gj'){
  var segs=[[90,460,.55],[550,340,.28],[890,250,.12]],i,done=false;
  if(t<90){var u=t/90;sy=1-.28*Math.sin(u*Math.PI/2*1);sx=1+.16*u}
  else{
   y=L;
   for(i=0;i<3;i++){var s=segs[i];if(t>=s[0]&&t<s[0]+s[1]){var u2=(t-s[0])/s[1];y=L-hmax*s[2]*4*u2*(1-u2);rot=(i%2?-1:1)*5*Math.sin(u2*Math.PI);done=true;
     if(u2<.12){sy=.9;sx=1.06}}}
   if(!done&&t>=1140){var q=Math.min(1,(t-1140)/120);sy=1-.1*Math.sin(q*Math.PI)}
   if(!S.hit[1]&&t>=550){S.hit[1]=true;matAnim('dip2');echoRings(2);sfx('boing')}
   if(!S.hit[2]&&t>=890){S.hit[2]=true;matAnim('soft');echoRings(1);sfx('boing')}}
 }else if(k==='gs'){
  var q2=Math.min(1,t/140);sy=1-.12*Math.sin(q2*Math.PI);sx=1+.06*Math.sin(q2*Math.PI)
 }else if(k==='miss'){
  if(t<120){sy=1-.14*Math.sin(t/120*Math.PI/2)}
  else if(t<420){var u3=(t-120)/300;y=L-hmax*.07*4*u3*(1-u3);sy=1}
  else{var u4=Math.min(1,(t-420)/150);sy=1-.1*Math.sin(u4*Math.PI)}
 }else{
  var u5=Math.min(1,t/130);sy=1-.38*Math.sin(u5*Math.PI/2);sx=1+.25*Math.sin(u5*Math.PI/2);
  if(t>130){var w=(t-130)/400;sy=.62+.38*Math.min(1,w*1.6);sx=1.25-.25*Math.min(1,w*1.6);x=Math.sin(w*26)*7*Math.max(0,1-w)}
 }
 setTok(y,sx,sy,rot,x);
 if(S.t>=S.R){S.ph='fade';S.t=0;var tk=$('#tok');if(tk)tk.classList.add('fade')}}

function togglePause(){
 if(S.screen!=='game'||S.ph==='idle')return;
 S.paused=!S.paused;
 var v=$('#veil');if(v)v.hidden=!S.paused;
 var b=$('[data-act="pause"]');if(b){b.setAttribute('aria-pressed',S.paused);b.setAttribute('aria-label',S.paused?'Davom ettirish':'Pauza')}
 if(S.paused){var rb=$('[data-act="pause"]');var rr=$('#veil .btn');if(rr)rr.focus()}}
document.addEventListener('visibilitychange',function(){if(document.hidden&&S.screen==='game'&&!S.paused&&S.ph!=='idle')togglePause()});
window.__api.step=step;window.__api.decide=decide;

/* 3: ekranlar va hodisalar */
function soundBtn(){return '<button class="ibtn" data-act="snd" aria-pressed="'+S.mute+'" aria-label="'+(S.mute?'Ovozni yoqish':'Ovozni o‘chirish')+'">'+ico(S.mute?'volume-x':'volume-2')+'</button>'}
function topBar(inner){return '<div class="top"><div class="brand"><i aria-hidden="true"><b></b><b></b><b></b></i><span>'+D.nom+'</span></div><div class="tools">'+(inner||'')+soundBtn()+'</div></div>'}

function sIntro(){
 var five='';FIVE.forEach(function(f){five+='<button data-act="hear" data-k="'+f.klip+'" aria-label="Tinglash: '+f.ar+'">'+ar(f.tok)+ico('volume-2')+'</button>'});
 return topBar()+
 '<div class="card stage"><span class="tape"></span>'+
 '<h1>Qalqala trampolini</h1>'+
 '<p>Sakin harflar trampolin ustiga tushadi. Ular orasida <b>qalqala harflari</b> bor — sukunda ularning tovushi ‘sapchiydi’. Harf tushayotganda qarorni o‘zingiz qabul qiling.</p>'+
 '<div class="how"><div class="h"><b>'+ico('arrow-up')+'Sakra</b>Qalqala harfi bo‘lsa — harf sapchiydi va aks-sado beradi.</div>'+
 '<div class="h j"><b>'+ico('arrow-down')+'Jim</b>Boshqa harf bo‘lsa — harf yumshoq qo‘nadi.</div></div>'+
 '<h2>Qalqala harflari</h2><p class="mut" style="margin-bottom:0">Bosing va tinglang — sukun bilan:</p>'+
 '<div class="five">'+five+'</div>'+
 '<p class="mut" style="text-align:center">Tezlik har harfda oshib boradi. Demo: '+S.N+' ta harf.</p>'+
 '<button class="sw" role="switch" data-act="calm" aria-checked="'+S.calm+'"><span class="knob"></span><span class="t"><b>Sokin rejim</b> — vaqt bosimisiz: harf trampolin tepasida kutadi'+(RM?' (harakatni kamaytirish yoqilgani uchun tavsiya etiladi)':'')+'.</span></button>'+
 '<div class="row c" style="margin-top:14px"><button class="btn big" data-act="start">'+ico('play')+'Boshlash</button></div>'+
 '</div><div class="foot">'+D.brend+'</div>'}

function sGame(){
 return topBar('<span class="chip" title="Ball">'+ico('star')+'<span id="score">0</span></span><span class="chip cmb" title="Ketma-ket to‘g‘ri">'+ico('check')+'<span id="combo">×0</span></span>'+
  '<button class="ibtn" data-act="hint" aria-pressed="false" aria-label="Eslatma: qalqala harflari">'+ico('lightbulb')+'</button>'+
  '<button class="ibtn" data-act="pause" aria-pressed="false" aria-label="Pauza">'+ico('pause')+'</button>')+
 '<div class="prog" aria-hidden="true"><div class="dots" id="dots"></div><span class="step" id="step"></span></div>'+
 '<div class="scene" id="scene">'+sceneSVG()+
 '<div class="veil" id="veil" hidden><div class="card g stage"><span class="tape"></span><h2>Pauza</h2><p class="mut">O‘yin to‘xtatildi.</p><button class="btn grn" data-act="pause">'+ico('play')+'Davom etish</button></div></div></div>'+
 '<div class="hintbar" id="hintbar" hidden><span class="hl">Qalqala:</span>'+FIVE.map(function(f){return ar(f.tok)}).join('')+'</div>'+
 '<div class="fb" id="fb" aria-live="polite"></div>'+
 '<div class="ctl"><button class="btn big" data-act="jump" disabled>'+ico('arrow-up')+'<span class="lab">Sakra<small>Qalqala harfi</small></span></button>'+
 '<button class="btn big sec" data-act="soft" disabled>'+ico('arrow-down')+'<span class="lab">Jim<small>Boshqa harf</small></span></button></div>'+
 '<div class="sr" id="live" aria-live="polite"></div>'}

function sEnd(){
 var Q=S.queue,n=Q.length,ok=0,i;Q.forEach(function(q){if(S.res[q].st===true)ok++});
 var ratio=ok/n,stars=ratio>=.9?3:(ratio>=.6?2:1),st='';
 for(i=0;i<3;i++)st+='<svg class="ic'+(i<stars?' on':'')+'" aria-hidden="true"><use href="#i-star"/></svg>';
 var sum='',miss=[];
 Q.forEach(function(q){var it=ITEMS[q],r=S.res[q],g=r.st===true;if(!g)miss.push(q);
  sum+='<div class="it '+(g?'ok':'no')+'"><div class="a">'+ar(it.tok)+'</div><div class="s">'+ico(g?'check':'x')+(it.qal?'sapchiydi':'jim')+'</div></div>'});
 var msg=ok===n?'Hammasi to‘g‘ri — trampolin sizniki!':(ratio>=.6?'Yaxshi natija! Xatolarni takrorlab ko‘ring.':'Mashq davom etadi — qalqala harflarini yana bir eshiting.');
 return topBar()+
 '<div class="card g stage" style="text-align:center"><span class="tape"></span>'+
 '<h2>Yakun</h2><div class="stars" role="img" aria-label="'+stars+' yulduz, 3 tadan">'+st+'</div>'+
 '<div class="score">'+ok+'<small> / '+n+'</small></div><p>'+msg+'</p>'+
 '<div class="mini"><div><b>'+S.score+'</b>ball</div><div><b>'+S.best+'</b>eng uzun ketma-ketlik</div><div><b>'+(S.calm?'–':S.aniq)+'</b>aniq sapchish</div></div>'+
 '<div class="sum" style="text-align:center">'+sum+'</div>'+
 '<div class="tip" style="text-align:left"><div class="t">'+ico('lightbulb')+'Sinab ko‘ring</div>Qalqala harflari: '+ar(FIVE_TXT)+'. Masalan, '+ar('بْ')+' ni sukun bilan ayting va oxirida yengil ‘sapchish’ni his qiling; '+ar('رْ')+' da esa sapchish yo‘q.'+(S.hintUsed?' <span class="mut">(Siz eslatmadan foydalandingiz.)</span>':'')+'</div>'+
 '<div class="row c">'+(miss.length?'<button class="btn" data-act="again">'+ico('rotate-ccw')+'Xatolarni takrorlash ('+miss.length+')</button>':'')+
 '<button class="btn '+(miss.length?'sec':'')+'" data-act="restart">'+ico('play')+'Qayta o‘ynash</button></div></div>'+
 '<div class="foot">'+D.brend+'</div>'}

function render(){
 var app=$('#app');if(!app)return;
 app.innerHTML=S.screen==='intro'?sIntro():(S.screen==='end'?sEnd():sGame());
 window.scrollTo(0,0);
 if(S.screen==='game'){drawHud();drawFb()}}

/* ---------- hodisalar ---------- */
var handledPtr=false;
document.addEventListener('pointerdown',function(e){
 var b=e.target.closest&&e.target.closest('[data-act="jump"],[data-act="soft"]');
 if(b&&!b.disabled){handledPtr=true;prime();decide(b.getAttribute('data-act')==='jump'?'jump':'soft')}});
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
 var a=b.getAttribute('data-act');
 if(a==='jump'||a==='soft'){if(handledPtr&&e.detail!==0){handledPtr=false;return}handledPtr=false;decide(a==='jump'?'jump':'soft');return}
 prime();
 if(a==='start'){startRun(ITEMS.map(function(_,i){return i}))}
 else if(a==='calm'){S.calm=!S.calm;b.setAttribute('aria-checked',S.calm)}
 else if(a==='snd'){S.mute=!S.mute;if(S.mute&&ac&&ac.suspend){}b.setAttribute('aria-pressed',S.mute);b.setAttribute('aria-label',S.mute?'Ovozni yoqish':'Ovozni o‘chirish');b.innerHTML=ico(S.mute?'volume-x':'volume-2')}
 else if(a==='hear'){var k=b.getAttribute('data-k');clip(k,1,0,'tinglash')}
 else if(a==='pause'){togglePause()}
 else if(a==='hint'){S.hint=!S.hint;if(S.hint)S.hintUsed=true;drawHud()}
 else if(a==='again'){var miss=S.queue.filter(function(q){return S.res[q].st!==true});startRun(miss)}
 else if(a==='restart'){S.screen='intro';render()}});
document.addEventListener('keydown',function(e){
 if(S.screen!=='game')return;
 var tg=e.target&&e.target.tagName,btn=(tg==='BUTTON');
 if(e.key==='ArrowUp'||(e.key===' '&&!btn)||e.key==='w'){e.preventDefault();decide('jump')}
 else if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();decide('soft')}
 else if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();togglePause()}
 else if(e.key==='h'||e.key==='H'){S.hint=!S.hint;if(S.hint)S.hintUsed=true;drawHud()}});

render();
window.__api.startRun=startRun;window.__api.render=render;
})();
</script>
<script>/* Qalqala trampolini - mobil qatlam: holatni DOM kuzatuvi orqali o'qiydi (IIFE ichiga kirmaydi) */
(function () {
  var M = window.MOBIL; if (!M) return;
  var R = document.documentElement, app = document.getElementById('app');
  var lastFb = null, lastScreen = null, sentEnd = false;
  function st() { return window.__api && window.__api.S; }
  function pausedNow() { var S = st(); return !!(S && S.paused); }
  function playing() { var S = st(); return !!(S && S.screen === 'game' && S.ph !== 'idle'); }
  function pause() {
    if (playing() && !pausedNow()) { var b = document.querySelector('[data-act="pause"]'); if (b) b.click(); return true; }
    return false;
  }
  function sync() {
    var S = st(); if (!S) return;
    R.classList.toggle('g-play', S.screen === 'game');
    var h = document.getElementById('hintbar'), sc = document.getElementById('scene');
    if (h && sc && h.parentNode !== sc) sc.appendChild(h);
    if (S.fb && S.fb !== lastFb) { M.hap(S.fb.cls === 'ok' ? 'ok' : 'err'); }
    lastFb = S.fb;
    if (S.screen !== lastScreen) {
      lastScreen = S.screen;
      if (S.screen === 'end') {
        var n = S.queue.length, ok = 0; S.queue.forEach(function (q) { if (S.res[q].st === true) ok++; });
        var r = ok / n;
        M.natija({ yulduz: r >= .9 ? 3 : (r >= .6 ? 2 : 1), ball: S.score, jami: n * 15, tugadi: true });
      }
    }
  }
  new MutationObserver(sync).observe(app, { childList: true, subtree: true });
  sync();
  M.onHidden(pause);
  M.setBack(function () { return pause(); });
  /* tugmalarni bosganda yengil tebranish */
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('[data-act="jump"],[data-act="soft"]');
    if (b && !b.disabled) M.hap('sel');
  }, true);
})();
</script></body>
