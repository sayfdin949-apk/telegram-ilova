<style>/* Harakat poyezdi — fonetika v6 Montessori (qog'oz, tape, yumshoq soya) */
:root{
 --bg:#F3EAD5;--ink:#45382A;--ink2:#6A5A45;--ink0:#2E2419;--cream:#FAF3E2;--sand:#DCCBA5;--sandd:#C4AE83;--hl:#A64A28;--cn:#2F6B52;
 --c:#E2793F;--cd:#8F3C12;--cl:#F5C9A8;--paper:#FBF5E6;--wood:#B98B55;--woodd:#8E6738;
 --fh:'Caveat','Segoe Script',cursive;--fb:'Lora',Georgia,serif;--far:'Madina','Sakkal Majalla','Noto Naskh Arabic',serif;
 --sh:0 2px 8px rgba(70,50,30,.2);--sh2:0 6px 18px rgba(70,50,30,.22);--k:1;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
.ar{font-family:var(--far);font-weight:400;direction:rtl;unicode-bidi:isolate;line-height:1.7}
bdi.ar{font-size:1.28em;line-height:1.2}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cn);outline-offset:3px;border-radius:6px}
.app{max-width:1060px;margin:0 auto;padding:10px 16px 24px;min-height:100vh;display:flex;flex-direction:column}
/* yuqori qator */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:52px}
.brand{font:700 22px/1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.hud{display:flex;align-items:center;gap:8px}
.ibtn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;color:var(--ink);font:700 18px/1 var(--fh)}
.ibtn:hover{background:#fff6e0}
.ibtn[aria-pressed="true"].tn{background:#CFE3D3;border-color:var(--cn)}
.btn{min-height:52px;padding:10px 26px;border:0;border-radius:16px;background:var(--c);color:var(--ink0);font:700 22px/1.1 var(--fh);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 var(--cd),var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cd)}
.btn.sec{background:var(--cream);box-shadow:0 3px 0 var(--sandd),var(--sh);border:2px solid var(--sandd)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.card{position:relative;background:var(--paper);border-radius:14px 20px 14px 18px;box-shadow:var(--sh2);padding:20px;border:1px solid rgba(196,174,131,.6)}
.card .tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-2.5deg);background:color-mix(in srgb,var(--c) 58%,transparent);box-shadow:0 1px 2px rgba(70,50,30,.2);clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0);z-index:3}
.card.r .tape{transform:rotate(2.5deg);left:82%}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--ink);line-height:1}
h1{font-size:clamp(52px,11vw,84px)}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:fin calc(.45s*var(--k)) ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
/* kirish */
.intro{align-items:center;justify-content:center}
.banner{width:100%;max-width:720px;text-align:center;margin-top:14px}
.banner h1{color:var(--cd)}
.story{font-size:19px;max-width:520px;margin:10px auto 6px}
.demo{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,4vw,34px);margin:14px 0 6px;min-height:120px}
.demo .dmp{width:96px}.demo .dmh{width:112px}
.demo .dmp svg,.demo .dmh svg{width:100%;display:block;overflow:visible}
.demo .arr{width:64px;height:26px;color:var(--c);align-self:center;margin-bottom:34px}
.demo .arr path{stroke-dasharray:8 8;animation:dash calc(1.2s*var(--k)) linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0 18px;text-align:left}
.rules span{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:1.5px solid var(--sand);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35}
.rules svg{color:var(--cd);margin-top:1px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}

.tw,.tw *,.ghost,.ghost *{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

.top{min-height:48px}

  .sign .sg-r{grid-area:r;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:6px;min-width:0}

  .hear svg{width:24px;height:24px}
  .mute{font-size:12px}

  .chip{font-size:19px;padding:4px 9px}

  .msg{min-height:56px;padding:6px 10px;gap:10px;font-size:14px;line-height:1.3}
  .msg .mi{display:none}
  .msg b.t{font-size:20px;margin-bottom:1px}
  .msg .btn{width:100%}
  .msg .mk{display:none}

  .tray h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tws{gap:6px}
  .tw{min-height:66px;padding:3px 2px 3px;gap:2px;border-radius:12px;box-shadow:0 2px 0 var(--sandd),var(--sh)}

  .tw .nm{font-size:17px}
  .tw .nm small{font-size:11.5px;margin-left:3px}
}
@media (max-width:640px) and (max-height:600px){
  .scene{min-height:90px}
}
.ghost{touch-action:none}
.m-ov{position:fixed;inset:0;z-index:80;background:rgba(70,50,30,.35);display:grid;place-items:center;padding:16px}
.m-box{background:var(--paper,#FBF5E6);border:2px solid var(--sandd,#C4AE83);border-radius:16px;padding:16px;max-width:340px;width:100%;box-shadow:0 8px 24px rgba(70,50,30,.3);text-align:center}

.m-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.m-row .btn{flex:1 1 130px;font-size:20px;padding:8px 12px}

<script>/* Harakat poyezdi - mobil qatlam: haptic, natija, orqaga (DOM kuzatuvi; o'yin kodi o'zgarmaydi) */
(function(){
'use strict';
var M=window.MOBIL;if(!M)return;
var app=document.getElementById('app'),doneKey=false,lastMsg='';
function $(s){return document.querySelector(s)}
/* haptic: vagonni ushlash */
document.addEventListener('pointerdown',function(e){var t=e.target;if(t&&t.closest&&t.closest('.tw'))M.hap('sel')},{capture:true,passive:true});
function onMut(list){
 var msg=false;
 for(var i=0;i<list.length;i++){var t=list[i].target;if(t&&t.nodeType===1&&(t.id==='msg'||(t.closest&&t.closest('#msg'))))msg=true}
 if(msg){var m=$('#msg');
  if(m){var sig=m.className+'|'+m.textContent.slice(0,60);
   if(sig!==lastMsg){lastMsg=sig;
    if(m.classList.contains('bad'))M.hap('err');
    else if(m.classList.contains('good'))M.hap($('#bNext')?'big':'ok');}}}
 var f=$('.fin .tot');
 if(f){
  if(!doneKey){
   doneKey=true;
   var m2=(f.textContent||'').match(/(\d+)\s*\/\s*(\d+)/);
   var tot=m2?+m2[1]:0,jami=m2?+m2[2]:21,n=Math.round(jami/3);
   var big=tot>=jami-2?3:(tot>=n*2?2:1);
   M.natija({yulduz:big,ball:tot,jami:jami,tugadi:true});
  }
 }else{doneKey=false}
}
if(app&&window.MutationObserver)new MutationObserver(onMut).observe(app,{childList:true,subtree:true});
/* orqaga: o'yin ichida chiqishni tasdiqlash oynasi */
var ov=null;
function hideOv(){if(ov){ov.remove();ov=null}}
function showOv(){
 if(ov)return;
 ov=document.createElement('div');ov.className='m-ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','Chiqish');
 ov.innerHTML='<div class="m-box"><p>O‘yindan chiqasanmi? Natijang saqlanmaydi.</p><div class="m-row"><button type="button" class="btn sec" data-m="stay">Davom etaman</button><button type="button" class="btn" data-m="exit">Chiqish</button></div></div>';
 ov.addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='stay')hideOv();else{hideOv();M.chiqish()}});
 document.body.appendChild(ov);M.hap('warn');
}
M.setBack(function(){
 if(ov){hideOv();return true}
 if($('.screen.play'))return showOv(),true;
 return false;
});
})();
</script></body>
</html>
