<style>/* asos: fonetika v6 Montessori tokenlari (Maxraj shahri bilan umumiy) */
:root{
 --bg:#F3EAD5;--ink:#45382A;--ink2:#6A5A45;--ink0:#2E2419;--cream:#FAF3E2;--sand:#DCCBA5;--sandd:#C4AE83;--hl:#A64A28;--cn:#2F6B52;
 --c:#E2793F;--cd:#8F3C12;--cl:#F5C9A8;--paper:#FBF5E6;--wood:#B98B55;--woodd:#8E6738;
 --fh:'Caveat','Segoe Script',cursive;--fb:'Lora',Georgia,serif;--far:'Madina','Sakkal Majalla','Noto Naskh Arabic',serif;
 --sh:0 2px 8px rgba(70,50,30,.2);--sh2:0 6px 18px rgba(70,50,30,.22);--k:1;--ink3:#7B6A52;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
.ar{font-family:var(--far);font-weight:400;direction:rtl;unicode-bidi:isolate;line-height:1.7}
bdi.ar{font-size:1.28em;line-height:1.2}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cn);outline-offset:3px;border-radius:6px}
.app{max-width:1060px;margin:0 auto;padding:10px 16px 24px;min-height:100vh;display:flex;flex-direction:column}
/* yuqori qator */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:52px}
.brand{font:700 22px/1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.hud{display:flex;align-items:center;gap:8px}
.ibtn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;color:var(--ink);font:700 18px/1 var(--fh)}
.ibtn:hover{background:#fff6e0}
.ibtn[aria-pressed="true"].tn{background:#CFE3D3;border-color:var(--cn)}
.btn{min-height:52px;padding:10px 26px;border:0;border-radius:16px;background:var(--c);color:var(--ink0);font:700 22px/1.1 var(--fh);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 var(--cd),var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cd)}
.btn.sec{background:var(--cream);box-shadow:0 3px 0 var(--sandd),var(--sh);border:2px solid var(--sandd)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* Quyosh va oy harflari — o'yin uslubi (asos.css dan keyin) */
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:fin calc(.45s*var(--k)) ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-2.5deg);background:color-mix(in srgb,var(--c) 58%,transparent);box-shadow:0 1px 2px rgba(70,50,30,.2);clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0);z-index:3}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--ink);line-height:1}
/* so'z: belgilar alohida bo'yaladi (harf shakllanishi buzilmaydi) */
.w{font-family:var(--far);direction:rtl;unicode-bidi:isolate;line-height:1.75;white-space:nowrap}
.w .lm,.w .sd,.w .sk,.w .f{transition:color calc(.9s*var(--k)) ease,text-shadow calc(.9s*var(--k)) ease}
.w .sd,.w .sk{color:transparent}
.w.sun .lm{color:rgba(69,56,42,.2)}
.w.sun .sd,.w.sun .f{color:var(--cd)}
.w.moon .lm{color:var(--cd);text-shadow:0 0 .35em rgba(226,121,63,.75),0 0 .1em rgba(226,121,63,.6)}
.w.moon .sk{color:var(--cd);text-shadow:0 0 .35em rgba(226,121,63,.75)}
.w.moon .f{color:var(--cd)}
/* kirish */
.intro{align-items:center;justify-content:center}
.intro .top{width:100%}
.banner{width:100%;max-width:760px;text-align:center;margin-top:14px}
.banner h1{color:var(--cd);font-size:clamp(46px,9.5vw,80px)}
.story{font-size:19px;max-width:540px;margin:10px auto 6px}
.demo{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin:22px auto 10px;max-width:560px}
.dm{border-radius:18px;padding:14px 12px 12px;border:2px solid var(--sandd);box-shadow:var(--sh);text-align:center;position:relative;overflow:hidden}
.dm.dsun{background:linear-gradient(180deg,#F7E4AE,#FBF1D6)}
.dm.dmoon{background:linear-gradient(180deg,#98A5C6,#C9D0E3)}
.dm .disc{position:absolute;top:10px;width:44px;height:44px}
.dm.dsun .disc{left:12px}.dm.dmoon .disc{right:12px}
.dm .w{font-size:54px;display:block;color:var(--ink0)}
.dm h3{font-size:30px;margin:2px 0 2px}
.dm p{margin:0;font-size:15.5px;line-height:1.4;color:var(--ink0)}
.dm .tr{font:700 22px/1.1 var(--fh);color:var(--ink0);margin-top:4px;display:block}
@media(min-width:620px){.demo{grid-template-columns:1fr 1fr;max-width:720px}}
.dm.dsun .w .lm{animation:lmelt calc(5s*var(--k)) ease-in-out infinite}
.dm.dsun .w .sd{animation:sdpop calc(5s*var(--k)) ease-in-out infinite}
.dm.dmoon .w .lm{color:var(--cd);text-shadow:0 0 .35em rgba(226,121,63,.7)}
.dm.dmoon .w .sk{color:var(--cd)}
@keyframes lmelt{0%,25%{color:var(--ink0)}45%,85%{color:rgba(69,56,42,.18)}100%{color:var(--ink0)}}
@keyframes sdpop{0%,35%{color:transparent}50%,85%{color:var(--cd)}100%{color:transparent}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0 18px;text-align:left}
.rules span{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border:1.5px solid var(--sand);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35}
.rules svg{color:var(--cd);margin-top:1px}
.best{font:700 22px/1 var(--fh);color:var(--ink2);margin-top:12px}
/* sahna */
.stage{max-width:960px;width:100%;margin:6px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.status{display:flex;flex-direction:column;gap:8px}
.progrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cnt{font:700 24px/1 var(--fh);color:var(--ink2);white-space:nowrap}
.dots{display:flex;gap:6px;flex:1;min-width:150px;align-items:center}
.dots i{flex:1;max-width:30px;height:14px;display:flex;align-items:center;justify-content:center}
.dots i b{width:11px;height:11px;transform:rotate(45deg);background:var(--sand);border-radius:2px;display:block;transition:background calc(.3s*var(--k)),transform calc(.3s*var(--k))}
.dots i.cur b{background:var(--cream);outline:2px solid var(--c);transform:rotate(45deg) scale(1.2)}
.dots i.ok b{background:var(--c)}
.dots i.no b{background:var(--sandd)}
.mapwrap{width:100%;max-width:460px;margin:0 auto;container-type:inline-size}
.map{position:relative;width:100%;aspect-ratio:400/560;border-radius:22px;overflow:hidden;border:3px solid var(--sandd);box-shadow:var(--sh2);background:#F3EAD5;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.map>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rays{transform-box:fill-box;transform-origin:center;animation:spin calc(60s*var(--k)) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw calc(3.2s*var(--k)) ease-in-out infinite alternate}
.tw:nth-child(2n){animation-delay:calc(-1.1s*var(--k))}.tw:nth-child(3n){animation-delay:calc(-2s*var(--k))}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.cloud{animation:drift calc(14s*var(--k)) ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
.glow{opacity:0;transition:opacity calc(.7s*var(--k))}
.map.gs .glow.s,.map.gm .glow.m{opacity:1}
.zone{position:absolute;top:22%;width:34%;aspect-ratio:1;margin-left:-17%;margin-top:-17%;border-radius:50%;border:0;background:transparent;cursor:pointer;z-index:4;padding:0;-webkit-appearance:none}

function dots(){
 var h='';for(var i=0;i<N;i++){var r=S.res[i];h+='<i class="'+(i===S.i&&S.phase!=='done-all'?'cur ':'')+(r&&r.done?(r.ok?'ok':'no'):'')+'"><b></b></i>'}
 $('#dots').innerHTML=h;$('#cnt').textContent='So‘z '+(S.i+1)+' / '+N;
}
function msgHTML(h){$('#msg').innerHTML=h}
function showWord(){
 var w=W[S.i],c=$('#wc'),map=$('#map');
 S.res[S.i]=S.res[S.i]||{id:w.id,ok:false,wrong:0,hint:false,done:false};
 map.className='map';$$('.zone').forEach(function(z){z.className=z.className.replace(/ ?over| ?nope/g,'')});
 c.className='wc';c.style.transform='';c.setAttribute('aria-label','So‘z: '+full(w)+', '+w.m);
 $('#wcw').innerHTML=wordHTML(w);$('#wcm').textContent=w.m;$('#wct').textContent=w.tr;
 void c.offsetWidth;c.classList.add('in');
 S.phase='wait';dots();
 msgHTML('<div class="t">Qaysi tomonga?</div><p>«'+ar('ٱلْ')+'» dan keyingi harfga qara: <b>quyosh</b> harfi lamni eritadi, <b>oy</b> harfi esa lamni yoritadi. Kartani sudra yoki quyosh/oy tugmasini bos.</p>');
 LOG.push('word:'+w.id);
}
/* ---------- sudrash ---------- */
function geo(){
 var map=$('#map'),mw=map.clientWidth,mh=map.clientHeight;
 return {mw:mw,mh:mh,hx:mw*.5,hy:mh*.66,sx:mw*.25,mx:mw*.75,zy:mh*.22,dr:mw*.095};
}
function setT(c,dx,dy,sc){c.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))'+(sc?' scale('+sc+')':'')}
function bindDrag(){
 var c=$('#wc');
 c.addEventListener('pointerdown',function(e){
  if(S.phase!=='wait')return;
  S.drag={x0:e.clientX,y0:e.clientY,moved:false,dx:0,dy:0,id:e.pointerId};
  try{c.setPointerCapture(e.pointerId)}catch(x){}
  c.classList.remove('back','fly','in','hintp');c.classList.add('grab');$('#map').classList.add('drag');
  e.preventDefault();
 });
 c.addEventListener('pointermove',function(e){
  var d=S.drag;if(!d||d.id!==e.pointerId)return;
  d.dx=e.clientX-d.x0;d.dy=e.clientY-d.y0;
  if(Math.abs(d.dx)+Math.abs(d.dy)>6)d.moved=true;
  setT(c,d.dx,d.dy);
  var g=geo(),cy=g.hy+d.dy,cx=g.hx+d.dx,up=cy<g.mh*.5;
  $('#zS').classList.toggle('over',up&&cx<g.mw*.5);$('#zM').classList.toggle('over',up&&cx>=g.mw*.5);
 });
 function end(e){
  var d=S.drag;if(!d||d.id!==e.pointerId)return;
  S.drag=null;c.classList.remove('grab');$('#map').classList.remove('drag');
  var z1=$('#zS'),z2=$('#zM');z1.classList.remove('over');z2.classList.remove('over');
  var g=geo(),cy=g.hy+d.dy,cx=g.hx+d.dx;
  if(d.moved&&cy<g.mh*.5&&S.phase==='wait'){
   c.classList.add('fly');choose(cx<g.mw*.5?'q':'o','drag',d);
  }else{
   c.classList.add('back');setT(c,0,0);
  }
 }
 c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
/* ---------- tanlov ---------- */
function flyTo(side){
 var c=$('#wc'),g=geo(),sc=.8,half=c.offsetHeight/2*sc;
 var tx=(side==='q'?g.sx:g.mx),ty=g.zy+g.dr+half+g.mw*.025;
 c.classList.remove('back','in');c.classList.add('fly');
 setT(c,tx-g.hx,ty-g.hy,sc);
 return {tx:tx,ty:ty};
}
function sparks(x,y,n,col){
 var map=$('#map'),b;
 for(var i=0;i<n;i++){
  b=document.createElement('i');b.className='spark';
  var a=Math.PI*2*i/n+Math.random()*.4,r=40+Math.random()*34;
  b.style.cssText='left:'+x+'px;top:'+y+'px;--px:'+(Math.cos(a)*r)+'px;--py:'+(Math.sin(a)*r)+'px'+(col?';background:'+col:'');
  map.appendChild(b);(function(el){setTimeout(function(){el.remove()},1300)})(b);
 }
}
function drops(){
 var map=$('#map'),lm=$('#wc .lm'),mr=map.getBoundingClientRect(),r=lm.getBoundingClientRect();
 for(var i=0;i<4;i++){
  var b=document.createElement('i');b.className='drop';
  b.style.left=(r.left-mr.left+r.width*(.2+i*.2))+'px';b.style.top=(r.bottom-mr.top-6)+'px';b.style.animationDelay=(i*.14*kf())+'s';
  map.appendChild(b);(function(el){setTimeout(function(){el.remove()},1700*Math.max(kf(),.05))})(b);
 }
}
function choose(side,how){
 if(S.phase!=='wait')return;
 var w=W[S.i],r=S.res[S.i],ok=side===w.t;
 S.phase='anim';LOG.push('choose:'+w.id+':'+side+':'+how+':'+(ok?'ok':'no'));
 fx('whoosh');
 var p=flyTo(side),map=$('#map'),c=$('#wc');
 wait(780).then(function(){
  if(!ok){
   r.wrong++;fx('no');
   var z=$(side==='q'?'#zS':'#zM');z.classList.add('nope');setTimeout(function(){z.classList.remove('nope')},600*Math.max(kf(),.05));
   c.classList.remove('fly');c.classList.add('shk');
   return wait(560).then(function(){
    c.classList.remove('shk');c.classList.add('back');setT(c,0,0);
    var q=w.t==='q';
    msgHTML('<div class="t no">Hali emas</div><p>'+ar(w.h)+' — <b>'+(q?'quyosh':'oy')+'</b> harfi. '+
     (q?'Oy tomonda lam yonib turadi, lekin bu harf lamni <b>eritib yuboradi</b>: so‘zni quyoshga yubor.':'Quyosh lamni erita olmaydi — bu harfdan oldin lam <b>aytiladi</b>: so‘zni oyga yubor.')+'</p>');
    S.phase='wait';
   });
  }
  /* to‘g‘ri: sahna jonlanadi */
  var q=w.t==='q',wd=$('#wcw .w');
  map.classList.add(q?'gs':'gm');
  if(q){drops();fx('melt')}else{fx('glow')}
  wd.classList.add(q?'sun':'moon');
  sparks(p.tx,p.ty-6,q?7:9,q?'#F7D58A':'#FBF5E6');
  return wait(1000).then(function(){
   c.classList.add('rev');fx('ok');
   r.ok=(r.wrong===0&&!r.hint);r.done=true;
   msgHTML('<div class="t ok">To‘g‘ri: '+(q?'quyosh':'oy')+' harfi</div><p>'+ar(w.h)+' — '+(q?'quyosh harfi. Lam <b>erib ketdi</b>: yozilgan, lekin o‘qilmaydi; '+ar(w.h)+' ustida <b>shadda</b> — harf ikki marta aytiladi':'oy harfi. Lam <b>ko‘rinib turibdi</b>: ustida <b>sukun</b>, aniq o‘qiladi')+'. O‘qilishi: <b>'+w.tr+'</b>.</p>'+
    '<div class="row"><button class="btn" id="bNext" type="button">'+(S.i===N-1?'Natija':'Keyingi so‘z')+ico('arrow-right')+'</button></div>');
   $('#bNext').addEventListener('click',next);
   S.phase='done';dots();
   try{$('#bNext').focus({preventScroll:true})}catch(e){}
  });
 });
}
function next(){
 if(S.phase!=='done')return;
 S.i++;
 if(S.i>=N){endScreen();return}
 showWord();
}
/* ---------- maslahat ---------- */
function chipsHTML(list,hit){return list.map(function(h){return '<span class="chip'+(hit&&hit[h]?' hit':'')+'">'+h+'</span>'}).join('')}
function listsHTML(hit){
 return '<div class="lset q"><h3>'+ico('sun')+'Quyosh harflari · 14</h3><div class="chips">'+chipsHTML(D.quyosh,hit)+'</div></div>'+
 '<div class="lset o"><h3>'+ico('circle')+'Oy harflari · 14</h3><div class="chips">'+chipsHTML(D.oy,hit)+'</div></div>';
}
var lastFocus=null;
function openHint(){
 if(S.sheet)return;
 S.sheet=true;lastFocus=document.activeElement;
 var r=S.res[S.i];if(r&&!r.done)r.hint=true;
 var v=document.createElement('div');v.className='veil';v.id='veil';
 v.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><h2 id="shT">Maslahat</h2>'+
 '<p>«'+ar('ٱلْ')+'» dan keyingi harf shu ro‘yxatlarning qaysi birida? <b>Quyosh</b> harfida lam eriydi, <b>oy</b> harfida lam ko‘rinadi.</p>'+listsHTML(null)+
 '<div class="row"><button class="btn" id="bClose" type="button">'+ico('check')+'Tushundim</button></div></div>';
 document.body.appendChild(v);
 $('#bClose').addEventListener('click',closeHint);
 v.addEventListener('click',function(e){if(e.target===v)closeHint()});
 $('#bClose').focus();
 LOG.push('hint:open');
}
function closeHint(){
 var v=$('#veil');if(v)v.remove();S.sheet=false;
 try{if(lastFocus)lastFocus.focus({preventScroll:true})}catch(e){}
 LOG.push('hint:close');
}
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&S.sheet)closeHint();
 if(e.key==='Tab'&&S.sheet){var b=$('#bClose');if(b){e.preventDefault();b.focus()}}
});
/* ---------- yakun ---------- */
function endScreen(){
 S.screen='end';S.phase='end';
 var ok=S.res.filter(function(r){return r.ok}).length,st=ok>=8?3:ok>=5?2:1;
 if(ok>S.best){S.best=ok;save()}
 var hit={};W.forEach(function(w){hit[nl(w.h)]=1});
 var grid=W.map(function(w,i){var r=S.res[i];return '<div class="'+(r.ok?'ok':'no')+'">'+wordHTML(w,w.t==='q'?' sun':' moon')+'<small>'+w.tr+' · '+(w.t==='q'?'quyosh':'oy')+'</small></div>'}).join('');
 app.innerHTML='<div class="app"><div class="screen end">'+top()+
 '<div class="endcard"><span class="tape"></span><div class="big">'+ok+' / '+N+'</div>'+
 '<div class="stars" role="img" aria-label="'+st+' yulduz">'+[1,2,3].map(function(n){return ico('star',n<=st?'on':'')}).join('')+'</div>'+
 '<p class="endmsg">'+(ok===N?'Hammasi birinchi urinishda — lam sendan sir yashira olmaydi.':ok>=5?'Yaxshi! Xato qilgan so‘zlaringni pastdagi ro‘yxatdan qayta ko‘r.':'Maslahat ro‘yxatini yodlab, yana bir urin.')+' Yashil — birinchi urinishda to‘g‘ri.</p>'+
 '<div class="res">'+grid+'</div>'+
 '<p class="endmsg">14 + 14 harf. Bu o‘yinda uchragan harflar to‘q sariq:</p>'+listsHTML(hit)+
 '<div class="row"><button class="btn" id="bAgain" type="button">'+ico('rotate-ccw')+'Qayta o‘ynash</button></div></div>'+
 '<div class="foot">Muhammad Amin</div></div></div>';
 bindSnd();$('#bAgain').addEventListener('click',startGame);
 fx('star');
}
/* ---------- boshlash ---------- */
load();setK();
window.__QO={S:S,D:D,W:W,LOG:LOG,cur:function(){return W[S.i]},side:function(){return W[S.i].t},choose:choose};
intro();
})();
</script>
<script>/* Quyosh va oy harflari - mobil qatlam (DOM kuzatuvi, IIFE'ga kirmaydi) */
(function () {
  var M = window.MOBIL; if (!M) return;
  var R = document.documentElement, app = document.getElementById('app');
  var lastT = null, lastGrab = false, endSent = false;
  function sync() {
    var t = document.querySelector('#msg .t');
    if (t && t !== lastT) {
      lastT = t;
      if (t.classList.contains('ok')) M.hap('ok');
      else if (t.classList.contains('no')) M.hap('err');
    }
    if (!t) lastT = null;
    var wc = document.getElementById('wc'), g = !!(wc && wc.classList.contains('grab'));
    if (g && !lastGrab) M.hap('light');
    lastGrab = g;
    R.classList.toggle('g-drag', g);
    var end = document.querySelector('.endcard');
    if (end && !endSent) {
      endSent = true;
      var Q = window.__QO, ok = Q.S.res.filter(function (r) { return r && r.ok; }).length, n = Q.W.length;
      M.natija({ yulduz: ok >= 8 ? 3 : (ok >= 5 ? 2 : 1), ball: ok, jami: n, tugadi: true });
    }
    if (!end) endSent = false;
  }
  new MutationObserver(sync).observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  sync();
  M.setBack(function () {
    var b = document.getElementById('bClose');
    if (b) { b.click(); return true; }
    return false;
  });
})();
</script></body>
