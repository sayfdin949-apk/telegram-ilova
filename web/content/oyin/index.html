<style>/* Fonetika o'yinlari - umumiy mobil qatlam CSS (barcha o'yinlarga oxirida qo'shiladi) */
:root{
  --sat:max(env(safe-area-inset-top,0px),var(--tg-sa-t,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--tg-sa-b,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--tg-sa-l,0px));
  --sar:max(env(safe-area-inset-right,0px),var(--tg-sa-r,0px));
  --vh:100vh;
}
@supports (height:100svh){:root{--vh:100svh}}
:root{--vh:var(--tg-vh,100vh)}
@supports (height:100svh){:root{--vh:var(--tg-vh,100svh)}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  padding-left:var(--sal);padding-right:var(--sar);min-height:var(--vh)}
button,a,[role=button],[data-act]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
img,svg{-webkit-user-drag:none}
#app,.app{min-height:var(--vh)}
#app.app,.app{padding-bottom:max(28px,calc(14px + var(--sab)))}

/* Telegramdan tashqarida: kichik "O'yinlar" tugmasi (Telegramda tizimning BackButton'i bor) */
.m-chip{position:fixed;left:max(10px,var(--sal));top:max(8px,var(--sat));z-index:60;display:inline-flex;align-items:center;gap:6px;
  min-height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid #C4AE83;background:#FAF3E2;color:#45382A;
  font:700 18px/1 'Caveat','Segoe Script',cursive;text-decoration:none;box-shadow:0 2px 8px rgba(70,50,30,.2)}
.m-chip svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m-chip:active{transform:translateY(1px)}
.m-web body{padding-top:calc(52px + var(--sat))}
@media (min-width:700px){.m-web body{padding-top:0}.m-chip{left:14px;top:12px}}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);overflow-x:hidden}
[hidden]{display:none!important}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hub{max-width:560px;margin:0 auto;padding:8px 16px max(28px,calc(14px + var(--sab,0px)));min-height:var(--vh,100vh)}
.top{display:flex;align-items:center;min-height:48px}
.brand{font:700 22px/1.1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.hero{padding:6px 2px 14px}
h1{margin:0;font:700 40px/1.05 var(--fh);color:var(--cd)}
.sub{margin:6px 0 0;color:var(--ink2);font-size:16px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.card{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:12px 14px;text-align:left;text-decoration:none;color:var(--ink);
 background:var(--cream);border:2px solid var(--sandd);border-radius:18px;box-shadow:var(--sh);position:relative}
.card:active{transform:translateY(1px);box-shadow:0 1px 4px rgba(70,50,30,.2)}
.card:focus-visible{outline:3px solid var(--cn);outline-offset:3px}
.ico{width:52px;height:52px;border-radius:14px;background:#F5C9A8;color:var(--cd);display:grid;place-items:center;flex:none;border:2px solid #E2A878}
.ico svg{width:28px;height:28px}
.txt{min-width:0;flex:1}
.nm{font:700 24px/1.05 var(--fh);color:var(--ink0);display:block}
.ds{display:block;font-size:14px;line-height:1.35;color:var(--ink2);margin-top:3px}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--ink2)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;background:#CFE3D3;color:#1F4A38;font-weight:700;font-size:12px}
.tag.new{background:#F5C9A8;color:var(--cd)}
.stars{display:flex;gap:2px;margin-left:auto}
.stars svg{width:18px;height:18px;fill:none;stroke:#B59D72;stroke-width:2;stroke-linejoin:round}
.stars svg.on{fill:var(--c);stroke:var(--cd)}
.go{color:var(--sandd)}
.foot{margin:20px 0 0;text-align:center;color:var(--ink2);font-size:14px}
</style>
</head>

  function merge(x, y) { var o = {}, k; for (k in x) o[k] = x[k]; for (k in y) o[k] = better(o[k], y[k]); return o; }
  function cloud(cb) {
    var t = M.tg;
    if (!(M.inTg && t && t.CloudStorage && tgv('6.9'))) { cb(null); return; }
    var fin = false, to = setTimeout(function () { if (!fin) { fin = true; cb(null); } }, 1500);
    try {
      t.CloudStorage.getItem(CKEY, function (err, v) {
        if (fin) return; fin = true; clearTimeout(to);
        if (err || !v) { cb(null); return; } try { cb(JSON.parse(v)); } catch (e) { cb(null); }
      });
    } catch (e) { if (!fin) { fin = true; clearTimeout(to); cb(null); } }
  }
  function csave(o) {
    var t = M.tg; if (!(M.inTg && t && t.CloudStorage && tgv('6.9'))) return;
    try { t.CloudStorage.setItem(CKEY, JSON.stringify(o), function () { }); } catch (e) { }
  }
  /* o'yin oxirida: {yulduz:0..3, ball:son, jami:son(ixtiyoriy), tugadi:true} */
  M.natija = function (r) {
    r = r || {}; log('natija:' + JSON.stringify(r));
    var id = M.id; if (!id || id === 'hub') return;
    var loc = lget(), old = loc[id] || {};
    var e = { y: Math.max(old.y || 0, Math.max(0, Math.min(3, r.yulduz | 0))), b: Math.max(old.b || 0, +r.ball || 0),
      n: (old.n || 0) + (r.tugadi === false ? 0 : 1), t: Date.now() };
    if (r.jami || old.j) e.j = Math.max(+r.jami || 0, old.j || 0);
    loc[id] = e; lset(loc);
    cloud(function (c) { csave(merge(c || {}, loc)); });
    try { D.dispatchEvent(new CustomEvent('mobil:natija', { detail: { id: id, e: e } })); } catch (x) { }
    return e;
  };
  M.oqi = function (cb) {                                /* hub: lokal + CloudStorage */
    var l = lget(); cb(l);
    M.whenReady(function () { cloud(function (c) { if (!c) return; var m = merge(l, c); lset(m); cb(m); }); });
  };

  /* ---------- ishga tushirish ---------- */
  function start() { loadTg(); }
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<script>(function () {
  var D = JSON.parse(document.getElementById('data').textContent), M = window.MOBIL, ul = document.getElementById('list'), sum = document.getElementById('sum');
  function ico(n, c) { return '<svg class="ic ' + (c || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>'; }
  function stars(y) { var s = ''; for (var i = 1; i <= 3; i++) s += '<svg class="' + (i <= y ? 'on' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>'; return s; }
  function draw(res) {
    res = res || {}; var played = 0, st = 0, h = '';
    D.oyinlar.forEach(function (o) {
      var r = res[o.slug] || {}, y = r.y || 0, n = r.n || 0; if (n) played++; st += y;
      h += '<li><a class="card" data-oyin="' + o.slug + '" href="' + o.slug + '/index.html" aria-label="' + o.nom + (y ? ', ' + y + ' yulduz' : n ? ', o‘ynalgan' : ', yangi') + '">' +
        '<span class="ico">' + ico(o.ikon) + '</span><span class="txt"><span class="nm">' + o.nom + '</span><span class="ds">' + o.qisqa + '</span>' +
        '<span class="meta"><span class="tag' + (n ? '' : ' new') + '">' + (n ? n + ' marta o‘ynalgan' : 'Yangi') + '</span><span class="stars" aria-hidden="true">' + stars(y) + '</span></span></span>' +
        '<span class="go">' + ico('chevron-right') + '</span></a></li>';
    });
    ul.innerHTML = h;
    sum.textContent = played ? (played + ' / ' + D.oyinlar.length + ' o‘yin o‘ynalgan · ' + st + ' yulduz') : (D.oyinlar.length + ' ta o‘yin. Birini tanla va o‘yna.');
  }
  draw({});
  M.oqi(draw);
})();
</script>
