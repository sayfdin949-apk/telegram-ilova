<script>/* Bo'g'in tetrisi — 1: yordamchilar, ma'lumot, ovoz, matnlar */
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TY = D.types;               // cv / cvc / cvv
const ORDER = ['cv', 'cvc', 'cvv']; // savat (yo'lak) tartibi: 0,1,2
const SORT = D.sort, ASM = D.asm;
const ALL_WORDS = SORT.concat(ASM);
const TAPE = ['rgba(226,121,63,.6)', 'rgba(47,107,82,.55)', 'rgba(63,110,140,.55)', 'rgba(185,139,85,.7)', 'rgba(166,74,40,.5)'];
const LS = 'bogin_tetrisi_demo_v1';
const ROWS = 8;                   // maydon qatorlari (0..7)
const TICK = RM ? 1000 : 650;     // bir qatorga tushish (ms)
const TICK_FAST = 70;

const S = { phase: 'start', wi: 0, si: 0, lane: 1, row: 0, mist: 0, paused: false, busy: false, fast: false,
            mute: false, ai: 0, ei: 0, ended: 0, played: [], timers: new Set(), tickT: null, blk: null, done: 0 };

function later(fn, ms) { const t = setTimeout(() => { S.timers.delete(t); fn(); }, ms); S.timers.add(t); return t; }
function clearAll() { S.timers.forEach(clearTimeout); S.timers.clear(); clearTimeout(S.tickT); stopAudio(); }

/* ---- ovoz: FAQAT egasining yozuvi (so'z klipi). Klip yo'q bo'lsa jim. ---- */
let curAudio = null;
function stopAudio() { if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; } }
function play(id) {
  return new Promise(res => {
    if (S.mute || !id || !window.AUDIO[id]) { later(res, id ? 250 : 900); return; }
    const a = new Audio(window.AUDIO[id]);
    curAudio = a; let fin = false;
    const done = ok => { if (fin) return; fin = true; clearTimeout(t); if (curAudio === a) curAudio = null; if (ok) { S.ended++; S.played.push(id); } res(); };
    a.addEventListener('ended', () => done(true));
    a.addEventListener('error', () => done(false));
    const t = setTimeout(() => done(false), 4500);
    const p = a.play(); if (p && p.catch) p.catch(() => done(false));
  });
}

/* ---- matnlar ---- */
function hint(sy, chosen) {
  const t = sy.t, a = `<bdi class="ar" dir="rtl">${sy.ar}</bdi>`, e = `<bdi class="ar" dir="rtl">${sy.end}</bdi>`;
  const m = {
    'cv>cvc': `${a}: oxirida sukunli harf yo‘q — bo‘g‘in harf + harakat bilan tugaydi. Bu ochiq qisqa bo‘g‘in (CV).`,
    'cv>cvv': `${a}: mad harfi (ا و ي) yo‘q, ovoz cho‘zilmaydi. Bu ochiq qisqa bo‘g‘in (CV).`,
    'cvc>cv': `${a}: oxirida sukunli harf ${e} bor — u oldingi bo‘g‘inga qo‘shiladi. Bu yopiq bo‘g‘in (CVC).`,
    'cvc>cvv': `${a}: ${e} — undosh, mad harfi emas. Ovoz cho‘zilmaydi, sukunli harf bo‘g‘inni yopadi. Bu CVC.`,
    'cvv>cv': `${a}: harakatdan keyin mad harfi ${e} keladi — ovoz cho‘ziladi. Bu cho‘ziq bo‘g‘in (CVV).`,
    'cvv>cvc': `${a}: ${e} — sukunsiz mad harfi, ovozni cho‘zadi va bo‘g‘inni yopmaydi. Bu CVV.`,
  };
  return m[t + '>' + chosen];
}
const OKTXT = {
  cv: 'harf + harakat — ochiq qisqa bo‘g‘in',
  cvc: 'harf + harakat + sukunli harf — yopiq bo‘g‘in',
  cvv: 'harf + harakat + mad harfi — cho‘ziq bo‘g‘in',
};
function say(html, kind, icon) {
  const el = $('#say'); if (!el) return;
  el.className = 'say' + (kind ? ' ' + kind : '');
  el.innerHTML = (icon ? ic(icon) : '') + `<span>${html}</span>`;
}
function dots(w) { return `<span class="dots">${w.sylls.map(s => `<i data-t="${s.t}" title="${TY[s.t].code}"></i>`).join('')}</span>`; }
function wordCard(w, live) {
  const silent = !w.klip;
  return `<div class="wd${live ? ' live' : ''}" data-w="${w.id}"><bdi class="ar" dir="rtl">${w.ar}</bdi>
  <span class="lt">${w.lat}<small>${w.sylls.map(s => TY[s.t].code).join(' · ')} ${dots(w)} ${silent ? `<span title="Ovoz yozuvi yo‘q">${ic('volume-x')}</span>` : ''}</small></span></div>`;
}
function stars() { return S.mist <= 1 ? 3 : S.mist <= 4 ? 2 : 1; }
function best() { try { return +localStorage.getItem(LS) || 0; } catch (e) { return 0; } }
function saveBest(n) { try { if (n > best()) localStorage.setItem(LS, String(n)); } catch (e) {} }

/* Bo'g'in tetrisi — 2: ekranlar va o'yin mantiqi */
const app = $('#app');

function topbar(stage) {
  const n = SORT.length + ASM.length;
  const pips = Array.from({ length: n }, (_, i) => `<i class="${i < S.done ? 'd' : i === S.done ? 'n' : ''}"></i>`).join('');
  return `<header class="top"><div class="brand"><i aria-hidden="true"><b></b><b></b><b></b></i>Bo‘g‘in tetrisi</div>
  <div class="tools">${stage ? `<span class="chip" id="stg">${stage}</span><span class="pips" aria-label="Jarayon: ${S.done} / ${n}" role="img">${pips}</span>
  <span class="chip" id="mst">Xato: <b>${S.mist}</b></span>` : ''}
  ${S.phase === 'sort' ? `<button class="chip" id="pz" aria-label="Pauza">${ic('pause')}<span>Pauza</span></button>` : ''}
  <button class="chip${S.mute ? '' : ' on'}" id="snd" aria-pressed="${!S.mute}" aria-label="Ovoz">${ic(S.mute ? 'volume-x' : 'volume-2')}<span>${S.mute ? 'Ovoz o‘chiq' : 'Ovoz'}</span></button></div></header>`;
}
function typeCards(cls) {
  const ex = { cv: 'harf + harakat', cvc: 'harf + harakat + sukunli harf', cvv: 'harf + harakat + mad harfi (ا و ي)' };
  return ORDER.map(k => `<div class="ty" data-t="${k}"><bdi class="ar" dir="rtl">${TY[k].ex}</bdi><span class="code">${TY[k].code}</span><b>${TY[k].nom}</b><small>${ex[k]}</small></div>`).join('');
}

/* ---------- boshlanish ---------- */
function showStart() {
  clearAll(); S.phase = 'start';
  const b = best();
  app.innerHTML = topbar(0) + `<main class="hero"><div class="card" style="width:100%"><span class="tape"></span>
  <h1>Bo‘g‘in tetrisi</h1>
  <p style="margin:10px auto 14px">Bo‘g‘in = harf + harakat. Tepadan tushayotgan bo‘g‘inni to‘g‘ri savatga yo‘naltiring, so‘ng bo‘g‘inlardan so‘z yig‘ing.</p>
  <div class="types">${typeCards()}</div></div>
  <div class="how"><div>${ic('arrow-left')}<span><b>◀ ▶</b> bo‘g‘inni savatga yo‘naltiring, <b>▼</b> tezroq tushiradi.</span></div>
  <div>${ic('check')}<span>Savat to‘g‘ri bo‘lsa bo‘g‘in o‘rnashadi. Noto‘g‘ri bo‘lsa — sababi yoziladi va u qayta tushadi.</span></div>
  <div>${ic('volume-2')}<span>So‘zning hamma bo‘g‘ini saralansa, qator to‘ladi va so‘z egasining ovozida o‘qiladi.</span></div></div>
  <p class="keys"><kbd>←</kbd> <kbd>→</kbd> yo‘lak · <kbd>↓</kbd> yoki <kbd>Probel</kbd> tushirish · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> savatga o‘tish · <kbd>P</kbd> pauza</p>
  <button class="btn" id="go">${ic('play')}Boshlash</button>
  ${b ? `<span class="chip ok">${ic('star')}Oldingi natija: ${b} / 3</span>` : ''}</main>`;
  $('#go').onclick = startGame; wireTop();
}
function wireTop() {
  const s = $('#snd'); if (s) s.onclick = () => { S.mute = !S.mute; if (S.mute) stopAudio(); s.className = 'chip' + (S.mute ? '' : ' on'); s.setAttribute('aria-pressed', String(!S.mute)); s.innerHTML = ic(S.mute ? 'volume-x' : 'volume-2') + `<span>${S.mute ? 'Ovoz o‘chiq' : 'Ovoz'}</span>`; };
  const p = $('#pz'); if (p) p.onclick = () => setPause(!S.paused);
}
function refreshTop() {
  const n = SORT.length + ASM.length;
  const pp = $('.pips'); if (pp) { pp.innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < S.done ? 'd' : i === S.done ? 'n' : ''}"></i>`).join(''); pp.setAttribute('aria-label', `Jarayon: ${S.done} / ${n}`); }
  const m = $('#mst b'); if (m) m.textContent = S.mist;
}

/* ---------- 1-bosqich: saralash ---------- */
function startGame() {
  clearAll(); Object.assign(S, { phase: 'sort', wi: 0, si: 0, lane: 1, row: 0, mist: 0, paused: false, busy: false, fast: false, ai: 0, ei: 0, done: 0 });
  app.innerHTML = topbar('1-bosqich · Saralash') + `<main class="play"><div class="left"><div class="board">
  <div class="field" id="field" role="group" aria-label="O‘yin maydoni: bo‘g‘in tepadan tushadi"><div class="lanes">${ORDER.map((k, i) => `<div class="lane" data-t="${k}" data-i="${i}"></div>`).join('')}</div></div>
  <div class="baskets">${ORDER.map((k, i) => `<button class="bsk" data-t="${k}" data-i="${i}" aria-label="${TY[k].nom} (${TY[k].code}) savati"><span class="hd"><b>${TY[k].code}</b><span>${TY[k].nom}</span></span><span class="stk"></span></button>`).join('')}</div></div>
  <div class="ctrl"><button class="btn alt" id="bl" aria-label="Chapga">${ic('arrow-left')}</button><button class="btn" id="bd" aria-label="Tushirish">${ic('arrow-down')}</button><button class="btn alt" id="br" aria-label="O‘ngga">${ic('arrow-right')}</button></div>
  <div class="say" id="say" role="status" aria-live="polite"></div></div>
  <aside class="side"><div class="shelf"><h2>So‘z qatori</h2><div class="words" id="words"></div></div>
  <div class="legend">${typeCards()}</div></aside></main>`;
  wireTop(); wireGame(); say('Bo‘g‘inni to‘g‘ri savatga yo‘naltiring.', '', 'info');
  setLane(1); later(spawn, 500);
}
function wireGame() {
  $('#bl').onclick = () => move(-1); $('#br').onclick = () => move(1); $('#bd').onclick = drop;
  $$('.bsk').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (S.busy || S.paused) return; if (S.lane !== i) setLane(i); else drop(); });
}
function setLane(i) {
  S.lane = Math.max(0, Math.min(2, i));
  $$('.lane').forEach(l => l.classList.toggle('on', +l.dataset.i === S.lane));
  $$('.bsk').forEach(b => b.classList.toggle('on', +b.dataset.i === S.lane));
  if (S.blk) S.blk.style.setProperty('--lane', S.lane);
}
function move(d) { if (S.busy || S.paused || S.phase !== 'sort') return; setLane(S.lane + d); }
function drop() { if (S.busy || S.paused || S.phase !== 'sort' || S.fast || !S.blk) return; S.fast = true; S.blk.classList.add('fast'); $('#field').style.setProperty('--tick', TICK_FAST + 'ms'); clearTimeout(S.tickT); S.tickT = setTimeout(tick, TICK_FAST); }
function setPause(v) {
  if (S.phase !== 'sort') return; S.paused = v;
  const p = $('#pz'); if (p) { p.innerHTML = ic(v ? 'play' : 'pause') + `<span>${v ? 'Davom' : 'Pauza'}</span>`; p.setAttribute('aria-label', v ? 'Davom etish' : 'Pauza'); }
  const f = $('#field'); if (f) f.style.opacity = v ? .55 : 1;
  if (v) say('Pauza. Davom etish uchun tugmani bosing.', '', 'pause'); else say('Davom etamiz.', '', 'play');
  if (!v && S.blk && !S.busy) { clearTimeout(S.tickT); S.tickT = setTimeout(tick, 120); }
}
function curSyl() { return SORT[S.wi].sylls[S.si]; }
function spawn() {
  if (S.phase !== 'sort') return;
  const sy = curSyl(), f = $('#field'); S.fast = false; S.row = 0; S.busy = false;
  f.style.setProperty('--tick', TICK + 'ms');
  const b = document.createElement('div'); b.className = 'blk in'; b.style.setProperty('--lane', S.lane); b.style.setProperty('--r', 0);
  b.style.setProperty('--wc', TAPE[S.wi % TAPE.length]); b.setAttribute('role', 'img'); b.setAttribute('aria-label', `bo‘g‘in: ${sy.lat}`);
  b.innerHTML = `<div class="tile"><span class="ar" dir="rtl">${sy.ar}</span></div>`;
  f.appendChild(b); S.blk = b;
  clearTimeout(S.tickT); S.tickT = setTimeout(tick, 60);
}
function tick() {
  if (S.phase !== 'sort' || S.busy || !S.blk) return;
  if (S.paused) return;
  if (S.row < ROWS - 1) { S.row++; S.blk.style.setProperty('--r', S.row); S.tickT = setTimeout(tick, S.fast ? TICK_FAST : TICK); }
  else land();
}
function land() {
  S.busy = true; const sy = curSyl(), chosen = ORDER[S.lane], w = SORT[S.wi], b = S.blk;
  if (chosen === sy.t) {
    b.remove(); S.blk = null;
    const bsk = $(`.bsk[data-i="${S.lane}"]`), stk = $('.stk', bsk);
    const m = document.createElement('div'); m.className = 'mini'; m.dataset.t = sy.t; m.dataset.w = w.id; m.innerHTML = `<span class="ar" dir="rtl">${sy.ar}</span>`; stk.appendChild(m);
    bsk.classList.remove('flash'); void bsk.offsetWidth; bsk.classList.add('flash');
    say(`To‘g‘ri. <b>${sy.lat}</b> — ${OKTXT[sy.t]}.`, 'ok', 'check');
    if (S.si === w.sylls.length - 1) later(completeWord, 700);
    else { S.si++; later(spawn, 650); }
  } else {
    S.mist++; refreshTop(); b.classList.add('shake', 'bad');
    say(hint(sy, chosen), 'bad', 'x');
    later(() => { b.remove(); S.blk = null; spawn(); }, 1500);
  }
}
async function completeWord() {
  const w = SORT[S.wi];
  $$(`.mini[data-w="${w.id}"]`).forEach(m => m.classList.add('clr'));
  say(w.klip ? `Qator to‘ldi — <bdi class="ar" dir="rtl">${w.ar}</bdi> so‘zi o‘qiladi.` : `Qator to‘ldi — <bdi class="ar" dir="rtl">${w.ar}</bdi>. Bu so‘z uchun ovoz yozuvi hozircha yo‘q.`, 'ok', w.klip ? 'volume-2' : 'volume-x');
  const wr = $('#words'); wr.insertAdjacentHTML('beforeend', wordCard(w, true));
  await play(w.klip);
  if (S.phase !== 'sort') return;
  $$(`.mini[data-w="${w.id}"]`).forEach(m => m.remove());
  const c = $(`.wd[data-w="${w.id}"]`); if (c) c.classList.remove('live');
  S.done++; S.wi++; S.si = 0; refreshTop();
  if (S.wi < SORT.length) later(spawn, 400); else later(startAsm, 500);
}

/* ---------- 2-bosqich: yig'ish ---------- */
function shuffle(w) { // deterministik, to'g'ri tartibga teng emas
  const n = w.sylls.length; return n === 3 ? [1, 2, 0] : w.sylls.map((_, i) => n - 1 - i);
}
function startAsm() {
  clearAll(); S.phase = 'asm'; S.ai = 0; S.busy = false;
  const w = ASM[S.ei], order = shuffle(w);
  app.innerHTML = topbar('2-bosqich · Yig‘ish') + `<main class="asm"><h2>Bo‘g‘inlardan so‘z yig‘ing</h2>
  <p style="margin:0;text-align:center;color:var(--ink2)">Arabcha so‘z o‘ngdan chapga o‘qiladi: birinchi bo‘g‘in — eng o‘ngdagi katakda.</p>
  <button class="btn alt" id="lis">${ic('volume-2')}Tinglash</button>
  <div class="slots" id="slots">${w.sylls.map((s, i) => `<div class="slot${i === 0 ? ' next' : ''}" data-i="${i}"></div>`).join('')}</div>
  <div class="asmword" id="aw"></div>
  <div class="tray" id="tray">${order.map((si, k) => `<button class="tb" data-si="${si}" aria-label="bo‘g‘in ${w.sylls[si].lat}"><span class="no">${k + 1}</span><span class="ar" dir="rtl">${w.sylls[si].ar}</span></button>`).join('')}</div>
  <div class="say" id="say" role="status" aria-live="polite"></div></main>`;
  wireTop(); $('#lis').onclick = () => play(w.klip);
  $$('.tb').forEach(t => t.onclick = () => pick(t));
  say('Avval so‘zni tinglang, so‘ng bo‘g‘inlarni tartib bilan joylang.', '', 'info');
  later(() => { if (S.phase === 'asm') play(w.klip); }, 500);
}
function pick(t) {
  if (S.busy || S.phase !== 'asm') return;
  const w = ASM[S.ei], si = +t.dataset.si, s = w.sylls[si];
  if (si === S.ai) {
    const slot = $(`.slot[data-i="${S.ai}"]`); slot.dataset.t = s.t; slot.classList.remove('next'); slot.classList.add('fill');
    slot.innerHTML = `<span class="ar" dir="rtl">${s.ar}</span>`; t.classList.add('used'); t.disabled = true; S.ai++;
    const nx = $(`.slot[data-i="${S.ai}"]`); if (nx) nx.classList.add('next');
    say(`To‘g‘ri. <b>${s.lat}</b> — ${OKTXT[s.t]}.`, 'ok', 'check');
    if (S.ai === w.sylls.length) finishAsm(w);
  } else {
    S.mist++; refreshTop(); t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); later(() => t.classList.remove('shake'), 600);
    say(`<bdi class="ar" dir="rtl">${s.ar}</bdi> — bu so‘zning ${si + 1}-bo‘g‘ini. Arabcha o‘ngdan chapga o‘qiladi: hozir ${S.ai + 1}-bo‘g‘inni qo‘ying.`, 'bad', 'x');
  }
}
async function finishAsm(w) {
  S.busy = true; $('#aw').innerHTML = `<span class="ar" dir="rtl">${w.ar}</span>`;
  say(`Tayyor — <bdi class="ar" dir="rtl">${w.ar}</bdi> (${w.lat}): ${w.sylls.map(s => TY[s.t].code).join(' + ')}.`, 'ok', 'volume-2');
  await play(w.klip);
  if (S.phase !== 'asm') return;
  S.done++; S.ei++; S.busy = false; refreshTop();
  if (S.ei < ASM.length) later(startAsm, 500); else later(showEnd, 500);
}

/* ---------- yakun ---------- */
function showEnd() {
  clearAll(); S.phase = 'end'; const n = stars(); saveBest(n);
  app.innerHTML = topbar(0) + `<main class="end"><div class="card" style="width:100%"><span class="tape"></span>
  <h2>Qator to‘ldi!</h2>
  <div class="stars" role="img" aria-label="${n} yulduz, 3 tadan">${[1, 2, 3].map(i => `<svg class="ic${i <= n ? ' on' : ''}" aria-hidden="true"><use href="#i-star"/></svg>`).join('')}</div>
  <p style="margin:10px 0 0">${S.mist === 0 ? 'Xatosiz!' : `Xatolar: ${S.mist}.`} Yetti so‘zdagi bo‘g‘inlarni turi bo‘yicha ajratdingiz:</p>
  <div class="types" style="margin-top:12px">${typeCards()}</div>
  <div class="words" style="justify-content:center;margin-top:14px">${ALL_WORDS.map(w => wordCard(w, false)).join('')}</div></div>
  <div class="row"><button class="btn" id="again">${ic('rotate-ccw')}Qayta o‘ynash</button></div></main>`;
  wireTop(); $('#again').onclick = startGame;
}

/* ---------- klaviatura ---------- */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, onBtn = e.target && e.target.tagName === 'BUTTON';
  if (S.phase === 'sort') {
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); move(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); move(1); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S' || ((k === ' ' || k === 'Enter') && !onBtn)) { e.preventDefault(); drop(); }
    else if (k === '1' || k === '2' || k === '3') { if (!S.busy && !S.paused) setLane(+k - 1); }
    else if (k === 'p' || k === 'P') setPause(!S.paused);
  } else if (S.phase === 'asm' && (k === '1' || k === '2' || k === '3')) {
    const t = $$('.tb')[+k - 1]; if (t && !t.disabled) pick(t);
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.phase === 'sort' && !S.paused) setPause(true); });
window.__bt = { S, move, drop, setLane, curSyl, SORT, ASM, ORDER, startGame };
showStart();
</script>
<script>/* Bo'g'in tetrisi - mobil qatlam. Demo skriptining global funksiyalari (setLane, drop, setPause) va S dan foydalanadi. */
(function () {
  var M = window.MOBIL; if (!M) return;
  var R = document.documentElement, app = document.getElementById('app');
  var lastMist = 0, lastSay = '', endSent = false;
  function sy() { return window.__bt && window.__bt.S; }
  function pauseNow() {
    var S = sy(); if (S && S.phase === 'sort' && !S.paused) { setPause(true); return true; } return false;
  }
  function sync() {
    var S = sy(); if (!S) return;
    R.classList.toggle('g-play', S.phase === 'sort' && !!document.getElementById('field'));
    if (S.mist > lastMist) M.hap('err');
    lastMist = S.mist;
    var say = document.getElementById('say');
    if (say) {
      var key = say.className + '|' + say.innerHTML;
      if (key !== lastSay) {
        lastSay = key;
        if (/\bok\b/.test(say.className)) M.hap('ok');
      }
    } else lastSay = '';
    if (S.phase === 'end') {
      if (!endSent) {
        endSent = true;
        var tot = (window.__bt.SORT.reduce(function (a, w) { return a + w.sylls.length; }, 0)) + window.__bt.ASM.reduce(function (a, w) { return a + w.sylls.length; }, 0);
        var st = S.mist <= 1 ? 3 : (S.mist <= 4 ? 2 : 1);
        M.natija({ yulduz: st, ball: Math.max(0, tot - S.mist), jami: tot, tugadi: true });
      }
    } else endSent = false;
  }
  new MutationObserver(sync).observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  sync();
  M.onHidden(pauseNow);
  M.setBack(pauseNow);
  /* maydonda sudrash: yo'lakni tanlash (tegib/surib), pastga surish - tushirish */
  var down = null;
  function laneAt(f, x) { var r = f.getBoundingClientRect(); return Math.max(0, Math.min(2, Math.floor((x - r.left) / r.width * 3))); }
  app.addEventListener('pointerdown', function (e) {
    var f = e.target.closest && e.target.closest('#field'); if (!f) return;
    var S = sy(); if (!S || S.phase !== 'sort' || S.paused || S.busy) return;
    down = { id: e.pointerId, x: e.clientX, y: e.clientY, lane: S.lane, dropped: false, f: f };
    try { f.setPointerCapture(e.pointerId); } catch (x) { }
    var l = laneAt(f, e.clientX); if (l !== S.lane) { setLane(l); M.hap('sel'); }
    e.preventDefault();
  });
  app.addEventListener('pointermove', function (e) {
    if (!down || e.pointerId !== down.id) return;
    var S = sy(); if (!S || S.busy || S.paused) return;
    var l = laneAt(down.f, e.clientX); if (l !== S.lane) { setLane(l); M.hap('sel'); }
    if (!down.dropped && e.clientY - down.y > 44) { down.dropped = true; drop(); M.hap('light'); }
  });
  function up(e) { if (down && e.pointerId === down.id) down = null; }
  app.addEventListener('pointerup', up); app.addEventListener('pointercancel', up);
  /* bosqichma-bosqich tugmalar: yengil tebranish */
  app.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('#bl,#br,#bd,.bsk');
    if (b) M.hap('light');
  }, true);
})();
</script></body>
