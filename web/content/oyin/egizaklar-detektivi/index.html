<style>/* Egizaklar detektivi — fonetika v6 Montessori (qog'oz, tape, yumshoq soya). NUQTA emas. */
:root{
 --bg:#F3EAD5;--ink:#45382A;--ink2:#6A5A45;--ink0:#2E2419;--cream:#FAF3E2;--sand:#DCCBA5;--sandd:#C4AE83;--hl:#A64A28;--cn:#2F6B52;
 --c:#E2793F;--cd:#8F3C12;--cl:#F5C9A8;--paper:#FBF5E6;--wood:#B98B55;--woodd:#8E6738;--woodl:#CFA46C;--blue:#4F7390;--bluel:#C9DAE3;
 --fh:'Caveat','Segoe Script',cursive;--fb:'Lora',Georgia,serif;--far:'Madina','Sakkal Majalla','Noto Naskh Arabic',serif;
 --sh:0 2px 8px rgba(70,50,30,.2);--sh2:0 6px 18px rgba(70,50,30,.22);--k:1;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
.ar{font-family:var(--far);font-weight:400;direction:rtl;unicode-bidi:isolate;line-height:1.7}
bdi.ar{font-size:1.28em;line-height:1.2}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cn);outline-offset:3px;border-radius:8px}
.app{overflow-x:clip;max-width:980px;margin:0 auto;padding:10px 16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--ink);line-height:1}
/* yuqori qator */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:52px}
.brand{font:700 22px/1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.hud{display:flex;align-items:center;gap:8px}
.ibtn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;color:var(--ink);font:700 18px/1 var(--fh)}
.ibtn:hover{background:#FFF6E0}
.btn{min-height:52px;padding:10px 26px;border:0;border-radius:16px;background:var(--c);color:var(--ink0);font:700 22px/1.1 var(--fh);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 var(--cd),var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform calc(.12s*var(--k)),box-shadow calc(.12s*var(--k))}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cd)}
.btn.sec{background:var(--cream);box-shadow:0 3px 0 var(--sandd),var(--sh);border:2px solid var(--sandd)}
.btn.sm{min-height:48px;padding:6px 18px;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.screen{animation:fin calc(.45s*var(--k)) both;display:flex;flex-direction:column;gap:14px;flex:1}
/* dalil nuqtalari */
.pins{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.pin{width:20px;height:20px;border-radius:50%;background:var(--sand);border:2px solid var(--sandd);position:relative;transition:all calc(.4s*var(--k))}
.pin.now{background:var(--cream);border-color:var(--c);transform:scale(1.25);box-shadow:0 0 0 3px rgba(226,121,63,.28)}
.pin.ok{background:var(--cn);border-color:#1F4F3B}
.pin.no{background:var(--hl);border-color:#7E361B}
.pin.ok::after,.pin.no::after{content:"";position:absolute;inset:3px;background:var(--cream);border-radius:50%;opacity:.9;transform:scale(.4)}
/* ---------- kirish sahnasi ---------- */
.office{max-width:700px;margin:0 auto;width:100%;position:relative;border-radius:24px;overflow:hidden;border:2px solid var(--sandd);box-shadow:var(--sh2);background:#EBDDB8}
.office svg.bg{display:block;width:100%;height:auto}
.office .twins{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;gap:clamp(18px,8vw,90px);align-items:flex-end;pointer-events:none}
.office .twins .tw{width:clamp(78px,17vw,140px);flex:none;max-width:none;pointer-events:none}
.office .lupa{position:absolute;width:clamp(70px,14vw,120px);right:14%;top:10%;transform-origin:70% 90%;animation:lupa calc(5s*var(--k)) ease-in-out infinite}
@keyframes lupa{0%,100%{transform:rotate(-8deg) translate(0,0)}50%{transform:rotate(10deg) translate(-14px,8px)}}
.office .sign{position:absolute;left:5%;top:7%;background:var(--paper);border:2px solid var(--sandd);border-radius:10px;padding:5px 12px;font:700 clamp(15px,3vw,20px)/1 var(--fh);color:var(--ink2);box-shadow:var(--sh);transform:rotate(-2deg)}
.intro-t{text-align:center}
.intro-t h1{font-size:clamp(44px,9vw,76px);color:var(--cd);letter-spacing:.01em}
.intro-t .sub{font:700 clamp(20px,3.4vw,26px)/1.1 var(--fh);color:var(--ink2);margin:6px 0 0}
.story{max-width:620px;margin:0 auto;text-align:center;font-size:17px;line-height:1.55;color:var(--ink)}
.demo-tag{display:inline-block;background:var(--cl);border:2px solid var(--c);color:var(--cd);border-radius:999px;padding:3px 14px;font:700 19px/1.2 var(--fh);margin-bottom:6px}

<script>/* Egizaklar detektivi - mobil qatlam (haptic, orqaga, natija, fon). window.__EZ: S, D, go, stop (yasash.py --mobil patch'i). */
(function(){
'use strict';
var M=window.MOBIL,Z=window.__EZ; if(!M||!Z||!Z.go)return;
var S=Z.S,D=Z.D,TOT=D.savol.length;
function $(s){return document.querySelector(s)}
function hap(k){try{M.hap(k)}catch(e){}}
var lastV=null,rep=false;
function check(){
 var v=$('#res .verdict');
 if(v!==lastV){lastV=v;if(v)hap(v.classList.contains('bad')?'err':'ok')}
 var f=$('.screen.final');
 if(f&&!rep){
  rep=true;
  var n=S.res.filter(function(r){return r&&r.ok}).length;
  M.natija({yulduz:n>=7?3:n>=5?2:1,ball:n,jami:TOT,tugadi:true});hap('big');
 }else if(!f)rep=false;
}
new MutationObserver(check).observe(document.getElementById('app'),{childList:true,subtree:true});
document.addEventListener('click',function(e){
 var t=e.target.closest&&e.target.closest('.sus,.ear,.btn,.ibtn,#bWord');
 if(!t||t.disabled)return;
 hap(t.matches('.sus')?'sel':'light');
},true);
/* orqaga: dalildan boshiga; boshida hubga */

 if(S.screen==='intro')return false;
 Z.go('intro');return true;
});

 try{if(!S.locked||$('#res .verdict'))S.seq++;Z.stop()}catch(e){}

});
})();
