<style>/* Sifat eshiklari — fonetika v6 Montessori (qog'oz, tape, yumshoq soya) */
:root{
 --bg:#F3EAD5;--ink:#45382A;--ink2:#6A5A45;--ink0:#2E2419;--cream:#FAF3E2;--sand:#DCCBA5;--sandd:#C4AE83;--hl:#A64A28;--cn:#2F6B52;
 --c:#E2793F;--cd:#8F3C12;--cl:#F5C9A8;--paper:#FBF5E6;--wood:#B98B55;--woodd:#8E6738;--woodl:#CFA46C;
 --fh:'Caveat','Segoe Script',cursive;--fb:'Lora',Georgia,serif;--far:'Madina','Sakkal Majalla','Noto Naskh Arabic',serif;
 --sh:0 2px 8px rgba(70,50,30,.2);--sh2:0 6px 18px rgba(70,50,30,.22);--k:1;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
.ar{font-family:var(--far);font-weight:400;direction:rtl;unicode-bidi:isolate;line-height:1.7}
bdi.ar{font-size:1.28em;line-height:1.2}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cn);outline-offset:3px;border-radius:6px}
.app{max-width:980px;margin:0 auto;padding:10px 16px 28px;min-height:100vh;display:flex;flex-direction:column}
/* yuqori qator */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:52px}
.brand{font:700 22px/1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.hud{display:flex;align-items:center;gap:8px}
.ibtn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;color:var(--ink);position:relative;font:700 18px/1 var(--fh)}
.ibtn:hover{background:#fff6e0}
.ibtn .cnt{background:var(--c);color:var(--ink0);border-radius:50%;min-width:22px;height:22px;display:grid;place-items:center;font:700 15px/1 var(--fb);padding:0 4px}
.ibtn.bump{animation:bump calc(.5s*var(--k))}
@keyframes bump{40%{transform:scale(1.18) rotate(-4deg)}}
.hearts{display:flex;gap:4px;align-items:center;min-height:48px;padding:0 6px}
.hearts svg{width:26px;height:26px;fill:var(--hl);stroke:#7E361B;transition:all calc(.4s*var(--k))}
.hearts svg.lost{fill:none;stroke:var(--sandd);transform:scale(.8)}
.hearts svg.pop{animation:bump calc(.5s*var(--k))}
.prog{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.prog .lt{font:400 34px/1 var(--far);color:var(--cd);padding:0 8px 0 0}
.prog .dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.prog .dots b{height:10px;flex:1;min-width:14px;max-width:44px;border-radius:6px;background:var(--sand);border:1.5px solid var(--sandd)}
.prog .dots b.on{background:var(--c);border-color:var(--cd)}
.prog .dots b.cur{background:var(--cl);border-color:var(--cd)}
.prog .step{font:700 18px/1 var(--fh);color:var(--ink2)}
/* tugmalar */
.btn{min-height:52px;padding:10px 26px;border:0;border-radius:16px;background:var(--c);color:var(--ink0);font:700 20px/1.1 var(--fh);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 var(--cd),var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform calc(.12s*var(--k)),box-shadow calc(.12s*var(--k))}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cd)}
.btn.sec{background:var(--cream);box-shadow:0 3px 0 var(--sandd),var(--sh);border:2px solid var(--sandd)}
.btn.sm{min-height:48px;padding:6px 18px;font-size:19px}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
/* qog'oz karta */
.card{position:relative;background:var(--paper);border-radius:14px 20px 14px 18px;box-shadow:var(--sh2);padding:22px 22px 20px;border:1px solid rgba(196,174,131,.6)}
.card .tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-2.5deg);background:color-mix(in srgb,var(--c) 58%,transparent);box-shadow:0 1px 2px rgba(70,50,30,.2);clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0)}
.card.r .tape{transform:rotate(2.5deg);left:18%}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;color:var(--ink);line-height:1}
h1{font-size:clamp(46px,9vw,78px)}
h2{font-size:34px;color:var(--cd)}
h3{font-size:26px;color:var(--cd)}
p{margin:.4em 0}
.muted{color:var(--ink2)}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:fin calc(.45s*var(--k)) ease both}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
/* kirish */
.intro{align-items:center;justify-content:center;text-align:center;padding-top:6px}
.intro .banner{width:100%;max-width:720px;position:relative}
.intro .hero-demo{display:flex;justify-content:center;gap:clamp(6px,3vw,26px);align-items:flex-end;margin:6px 0 4px}
.intro .hero-demo .hero{position:relative;left:auto;bottom:auto}
.intro .story{font-size:19px;max-width:560px;margin:14px auto 18px}
.intro .rules{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:15px;color:var(--ink2);margin-top:14px}
.intro .rules span{display:inline-flex;align-items:center;gap:6px}
/* tayyorlanish */
.prep .steps{display:flex;gap:8px}
.prep .steps b{flex:1;height:9px;border-radius:6px;background:var(--sand);border:1.5px solid var(--sandd)}
.prep .steps b.on{background:var(--c);border-color:var(--cd)}
.mx{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:18px;align-items:start}
.mxsvg{background:linear-gradient(#F7E8C8,#F0DFB8);border-radius:20px;border:2px solid var(--sandd);box-shadow:var(--sh);padding:6px;position:relative}
.mxsvg svg{width:100%;height:auto;display:block}
.mxinfo{min-height:200px;display:flex;flex-direction:column;gap:10px}
.mxinfo .big{font:400 92px/1.1 var(--far);color:var(--cd);text-align:center;direction:rtl}
.mxinfo .nm{font:700 28px/1 var(--fh);color:var(--cd)}
.spot{cursor:pointer}
.spot .ring{pointer-events:none;fill:none;stroke:var(--cd);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring calc(1.6s*var(--k)) ease-out infinite}
.spot.seen .ring{animation:none;opacity:0}
.spot .dot{fill:var(--c);stroke:var(--cd);stroke-width:3}
.spot.sel .dot{fill:var(--cn);stroke:#1F4A38}
.spot text{font-family:var(--far);fill:var(--ink0);pointer-events:none}
.spot:focus-visible{outline:none}
.spot:focus-visible .dot{stroke:var(--ink0);stroke-width:5}
.lab{font:700 17px var(--fh);fill:var(--ink2)}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.crit{display:flex;flex-direction:column;gap:12px}
.crit .q{font:700 22px/1.1 var(--fh);color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;font-size:20px}
.crit .q em{font-style:normal;color:var(--cd);background:var(--cl);padding:2px 10px;border-radius:10px}
.pair{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.pair div{background:var(--cream);border:2px solid var(--sandd);border-radius:14px;padding:10px 12px;text-align:center}
.pair b{display:block;font:700 28px/1 var(--fh);color:var(--cd)}
.pair span{font-size:15px;color:var(--ink2)}
.mnem{background:var(--cl);border-radius:14px;padding:10px 14px;text-align:center}
.mnem .ar{font-size:34px;line-height:1.5;color:var(--ink0)}
.mnem small{display:block;font-size:14px;color:var(--cd);font-weight:700}
.zlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.zlist div{background:var(--cream);border:2px solid var(--sandd);border-radius:12px;padding:8px 10px;font-size:15px;line-height:1.3}
.zlist b{font:700 22px/1 var(--fh);color:var(--cd);display:block}
.zlist bdi.ar{font-size:1.2em}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager .n{font:700 22px var(--fh);color:var(--ink2)}
.qa{display:flex;flex-direction:column;gap:12px}
.qa .opts{display:flex;gap:10px;flex-wrap:wrap}
.qa .opt{min-height:52px;min-width:88px;padding:8px 22px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);cursor:pointer;font:700 24px/1 var(--fh);box-shadow:0 3px 0 var(--sandd)}
.qa .opt.ar{font-size:36px}
.qa .opt:hover{background:#fff6e0}
.qa .opt.ok{background:#CFE3D3;border-color:var(--cn)}
.qa .opt.no{background:var(--cl);border-color:var(--hl)}
.qa .iz{padding:12px 14px;border-radius:14px;background:var(--cream);border-left:6px solid var(--cn)}
.qa .iz.no{border-left-color:var(--hl)}
.qa .q{font-size:20px}
.qa .q bdi.ar{font-size:1.5em}
/* eshik oldidagi panel */
.panel{display:flex;flex-direction:column;gap:10px}
.panel .tag{font:700 20px/1 var(--fh);color:var(--ink2);letter-spacing:.05em}
.panel .tag em{font-style:normal;color:var(--cd)}
.panel .riddle{font-size:clamp(18px,2.6vw,22px);font-weight:600;line-height:1.35}
.panel .try{background:var(--cl);border-radius:14px;padding:10px 14px;font-size:16px;animation:fin calc(.35s*var(--k)) both}
.panel .try .ar{font-size:1.3em}
.panel .res{padding:12px 14px;border-radius:14px;background:var(--cream);border-left:7px solid var(--cn);display:flex;gap:10px;align-items:flex-start;animation:fin calc(.35s*var(--k)) both}
.panel .res.no{border-left-color:var(--hl);background:#F7E2CF}
.panel .res svg{margin-top:2px}
.panel .res.ok svg{color:var(--cn)}.panel .res.no svg{color:var(--hl)}
.panel .res .tx{flex:1}
.panel .acts{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- sahna ---------- */
.stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--sh2);border:2px solid var(--sandd);background:#F4E4C0;--pathH:128px;--hw:92px;transition:opacity calc(.3s*var(--k))}
.sky{position:relative;height:58px;background:linear-gradient(#F9EBCB,#F2DFB4);overflow:hidden}
.sky .sun{position:absolute;right:11%;top:9px;width:38px;height:38px;border-radius:50%;background:#F2B766;box-shadow:0 0 0 7px rgba(242,183,102,.3),0 0 0 15px rgba(242,183,102,.16)}
.sky svg{position:absolute;left:0;bottom:0;width:100%;height:46px}
.fence{position:relative;padding:16px clamp(10px,3vw,30px) 0;background:repeating-linear-gradient(90deg,#DCCBA5 0 34px,#D2BF94 34px 36px);border-top:8px solid #B49A66;box-shadow:inset 0 10px 14px -10px rgba(70,50,30,.35)}
.fence::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:#A98F5E}
.wall{display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,4vw,44px);position:relative;z-index:1;padding-bottom:12px}
.wall.gate{flex-wrap:wrap;gap:12px 10px;row-gap:6px}
.path{position:relative;height:var(--pathH);background:
 radial-gradient(circle at 12% 62%,rgba(120,95,55,.35) 0 3px,transparent 4px),radial-gradient(circle at 36% 30%,rgba(120,95,55,.3) 0 2.5px,transparent 3.5px),
 radial-gradient(circle at 63% 70%,rgba(120,95,55,.35) 0 3.5px,transparent 4.5px),radial-gradient(circle at 86% 36%,rgba(120,95,55,.3) 0 2.5px,transparent 3.5px),
 linear-gradient(#CDB98C,#BEA672)}
.path::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:rgba(120,95,55,.25)}
/* eshik */
.door{position:relative;display:flex;flex-direction:column;align-items:center;width:var(--dw,clamp(92px,24vw,150px));padding:0;background:none;border:0;cursor:pointer;touch-action:manipulation}
.plaque{position:relative;margin-bottom:12px;padding:5px 10px 6px;min-width:76%;max-width:100%;text-align:center;background:var(--cream);border:2px solid var(--woodd);border-radius:6px;box-shadow:0 2px 0 var(--woodd),var(--sh);font:700 clamp(19px,3vw,25px)/1.05 var(--fh);color:var(--ink0);transition:transform calc(.2s*var(--k))}
.plaque.q{font:700 14px/1.15 var(--fb);padding:5px 6px 6px}
.plaque::before,.plaque::after{content:'';position:absolute;top:100%;width:2px;height:12px;background:var(--woodd)}
.plaque::before{left:20%}.plaque::after{right:20%}
.door:hover .plaque{transform:rotate(-2deg)}
.frame{position:relative;width:100%;aspect-ratio:var(--da,.64);background:#6E4C2A;border-radius:6px 6px 0 0;padding:6px 6px 0;box-shadow:var(--sh);perspective:700px}
.hole{position:absolute;inset:6px 6px 0 6px;background:linear-gradient(#5A4128,#3F2E1C);display:grid;place-items:center;transition:background calc(.5s*var(--k))}
.leaf{position:absolute;inset:6px 6px 0 6px;transform-origin:left center;background:
 repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(90,60,30,.55) calc(25% - 1px) 25%),linear-gradient(#C99A5E,#B98B55);
 border-radius:3px 3px 0 0;box-shadow:inset 0 0 0 3px rgba(110,76,42,.6);transition:transform calc(.9s*var(--k)) cubic-bezier(.3,.7,.3,1);backface-visibility:hidden}
.leaf::before,.leaf::after{content:'';position:absolute;left:8%;right:8%;height:9%;background:#9C7440;border-radius:2px;box-shadow:0 1px 0 rgba(255,235,200,.35)}
.leaf::before{top:16%}.leaf::after{bottom:16%}
.knob{position:absolute;right:11%;top:52%;width:12px;height:12px;border-radius:50%;background:#F0CE8C;border:2px solid #8E6738;z-index:2}
.door.open .leaf{transform:rotateY(-108deg)}
.door.open .hole{background:radial-gradient(circle at 50% 60%,#FBE3B0,#F2B766 60%,#E2793F)}
.door .glow{position:absolute;inset:6px;opacity:0;pointer-events:none}
.door.found .plaque{background:#CFE3D3;border-color:var(--cn)}
.door:disabled{cursor:default}
.door.shake .frame{animation:shake calc(.45s*var(--k))}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.wall.gate .door{--dw:calc((100% - 20px)/3 - 1px);--da:.78}
.wall.gate .plaque{font-size:19px;padding:3px 6px 4px;margin-bottom:10px}
.wall.gate .plaque.q{font-size:12.5px}
.wall.gate .door .knob{width:9px;height:9px}
@media(min-width:760px){
 .wall.gate .door{--dw:112px}
 .wall.gate{max-width:680px;margin:0 auto}
}
/* personaj */
.hero{position:absolute;bottom:12px;width:var(--hw);height:calc(var(--hw)*1.29);left:-130px;z-index:5;transition:left calc(.9s*var(--k)) ease-in-out,transform calc(.9s*var(--k)) ease-in-out,opacity calc(.5s*var(--k))}
.hero.sm{--hw:70px}
.hero-clip{position:absolute;inset:0;overflow:visible}
.hero.cut .hero-clip{overflow:hidden}
.hero svg{width:100%;height:100%;overflow:visible;display:block}
.hero .hin{position:absolute;inset:0;transition:transform calc(.6s*var(--k)) cubic-bezier(.3,.8,.4,1)}
.hero .ltr{font-family:var(--far);font-size:76px;fill:var(--cd);text-anchor:middle}
.hero .foot{fill:#7A6548;transform-box:fill-box;transform-origin:50% 0}
.hero.walk .f1{animation:step calc(.34s*var(--k)) ease-in-out infinite}
.hero.walk .f2{animation:step calc(.34s*var(--k)) ease-in-out infinite reverse}
.hero.walk .hb{animation:bob calc(.34s*var(--k)) ease-in-out infinite}
@keyframes step{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-8px) rotate(14deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hero .hb{transform-box:fill-box}
.hero.idle .hb{animation:breath calc(2.6s*var(--k)) ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.02,.985)}}
.hero .face>g{display:none}
.hero.e-n .face .n,.hero.e-h .face .h,.hero.e-s .face .s,.hero.e-d .face .d{display:inline}
.hero.hop{animation:hop calc(.6s*var(--k)) ease-out}
@keyframes hop{35%{transform:translateY(-26px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.05,.95)}}
.hero .shadow{fill:rgba(70,50,30,.22)}
.hero.born{animation:born calc(1.1s*var(--k)) cubic-bezier(.2,.9,.3,1.2) both}
@keyframes born{0%{transform:translate(-50%,-50%) scale(.05)}100%{}}
/* tuzoq */
.pit{position:absolute;bottom:4px;width:calc(var(--hw)*1.5);height:calc(var(--hw)*.5);left:0;z-index:4;pointer-events:none}
.pit i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#2E2419 30%,#4B3A27 70%);transform:scale(0);transition:transform calc(.35s*var(--k)) ease-out;box-shadow:0 0 0 5px #8E6738}
.pit.on i{transform:scale(1)}
.pit .pl{position:absolute;top:0;width:50%;height:100%;background:#B98B55;border:2px solid #8E6738;transition:transform calc(.4s*var(--k)) ease-in;z-index:1}
.pit .pl.a{left:0;transform-origin:left;border-radius:50% 0 0 50%}.pit .pl.b{right:0;transform-origin:right;border-radius:0 50% 50% 0}
.pit.on .pl.a{transform:scaleX(.1)}.pit.on .pl.b{transform:scaleX(.1)}
.puff{position:absolute;z-index:6;pointer-events:none;border-radius:50%;background:#E9DBBA;border:2px solid #CDB98C;opacity:0}
.puff.go{animation:puff calc(1s*var(--k)) ease-out both}
@keyframes puff{0%{opacity:.95;transform:translate(0,0) scale(.3)}70%{opacity:.8}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(1.6)}}
.pufftx{position:absolute;z-index:7;font:700 40px/1 var(--fh);color:var(--cd);pointer-events:none;animation:ptx calc(1.1s*var(--k)) ease-out both}
@keyframes ptx{0%{opacity:0;transform:translateY(8px) scale(.5) rotate(-8deg)}30%{opacity:1;transform:translateY(-14px) scale(1.15) rotate(4deg)}100%{opacity:0;transform:translateY(-44px) scale(1)}}
.spark{position:absolute;z-index:7;width:14px;height:14px;pointer-events:none;background:#F2B766;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0}
.spark.go{animation:spark calc(.9s*var(--k)) ease-out both}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(1.4) rotate(120deg)}}
/* shakllar */
.forms{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.forms div{background:var(--cream);border:2px solid var(--sandd);border-radius:14px;padding:6px 14px 8px;text-align:center;min-width:76px;animation:fin calc(.4s*var(--k)) both}
.forms .ar{font-size:64px;line-height:1.35;color:var(--ink0);display:block}
.forms small{font:700 17px var(--fh);color:var(--cd)}
/* albom */
.ov{position:fixed;inset:0;z-index:50;background:rgba(70,50,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.albom{width:100%;max-width:880px;background:var(--bg);background-image:var(--grain);border-radius:22px;box-shadow:var(--sh2);padding:20px;margin:auto;position:relative;animation:fin calc(.35s*var(--k)) both}
.albom .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px 16px}
.acard{position:relative;background:var(--paper);border-radius:14px 20px 14px 18px;box-shadow:var(--sh2);padding:18px 16px 16px;border:1px solid rgba(196,174,131,.6);text-align:center}
.acard.empty{display:grid;place-items:center;min-height:180px;color:var(--ink2);background:var(--sand);box-shadow:none;border:2px dashed var(--sandd);font:700 22px var(--fh)}
.acard .letter{width:104px;height:104px;margin:0 auto 6px;border-radius:50%;background:var(--cream);box-shadow:var(--sh),0 0 0 4px var(--cl);display:grid;place-items:center}
.acard .letter .ar{font-size:76px;line-height:1;color:var(--cd);padding-top:12px}
.acard .mj{font-size:14.5px;line-height:1.3;color:var(--ink2);margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.chips span{background:var(--cl);border-radius:10px;padding:3px 10px;font:700 19px/1.1 var(--fh);color:var(--ink0)}
.chips span.g{background:#CFE3D3}
.acard .fm{display:flex;gap:6px;justify-content:center;direction:ltr;margin:4px 0 6px}
.acard .fm .ar{font-size:36px;line-height:1.3;background:var(--cream);border-radius:10px;padding:0 8px;border:1.5px solid var(--sandd)}
.acard .snd{margin-top:4px}
.fly{position:fixed;z-index:60;pointer-events:none;transition:all calc(.8s*var(--k)) cubic-bezier(.5,0,.3,1)}
/* yakun */
.fin-scr{text-align:center;align-items:center}
.stars{display:flex;gap:10px;justify-content:center;margin:6px 0}
.stars svg{width:62px;height:62px;fill:var(--sand);stroke:var(--sandd);stroke-width:1.6;stroke-linejoin:round}
.stars svg.on{fill:#F2B766;stroke:var(--cd);animation:starin calc(.7s*var(--k)) both}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.lostbox{background:var(--cream);border-radius:20px;padding:22px;box-shadow:var(--sh2);max-width:520px;width:100%;text-align:center}
.mini-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.mini-cards .letter{width:84px;height:84px;border-radius:50%;background:var(--cream);box-shadow:var(--sh),0 0 0 4px var(--cl);display:grid;place-items:center}
.mini-cards .letter .ar{font-size:60px;line-height:1;color:var(--cd);padding-top:9px}
.scroll-x{overflow-x:auto}
.noscr{position:absolute;left:-9999px}
@media(max-width:700px){
 .mx{grid-template-columns:1fr}
 .app{padding:8px 14px 24px}
 .card{padding:20px 16px 16px}
 .brand{font-size:19px}
 .stage{--hw:80px;--pathH:112px}
 .ibtn.txt span{display:none}
}
@media(max-width:380px){.brand span{display:none}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
 .spot .ring{opacity:0}
}

.pit{opacity:0}.pit.on{opacity:1}
.hero.cut .hero-clip{clip-path:inset(-90px -90px 7% -90px)}
.hero-clip{position:absolute;inset:0}

.lsv{display:block;width:100%;height:100%;overflow:visible}.lsv text{font-family:var(--far);fill:currentColor}
.prog .lt{width:46px;height:46px;color:var(--cd);flex:none;padding:0}
.mxinfo .big{width:120px;height:120px;margin:0 auto;color:var(--cd)}
.letter .lsv{width:100%;height:100%}.acard .letter,.mini-cards .letter{color:var(--cd)}
.acard .letter .lsv,.mini-cards .letter .lsv{width:84%;height:84%}
.hero .ltr{text-anchor:start}
.resbox{margin-top:14px}.resbox:empty{display:none}
.resbox .res{padding:14px 16px;border-radius:16px;background:var(--paper);border:1px solid rgba(196,174,131,.6);border-left:8px solid var(--cn);box-shadow:var(--sh2);display:flex;gap:10px;align-items:flex-start;animation:fin calc(.35s*var(--k)) both}
.resbox .res.no{border-left-color:var(--hl);background:#F7E2CF}
.resbox .res svg{margin-top:2px}.resbox .res.ok svg{color:var(--cn)}.resbox .res.no svg{color:var(--hl)}.resbox .res .tx{flex:1}
.resbox .acts{display:flex;gap:10px;flex-wrap:wrap}
.foot{text-align:center;font:italic 500 14px var(--fb);color:var(--ink2);letter-spacing:.04em;padding:18px 0 0}
.brand span{white-space:nowrap}
@media(max-width:520px){.s-road .brand span,.s-birth .brand span{display:none}.hearts svg{width:23px;height:23px}.hud{gap:6px}}
.forms .ar{height:104px;line-height:1.9;padding-top:6px;overflow:visible}
.forms div{padding-bottom:10px}.forms small{display:block;margin-top:6px}
.spot.sel text{fill:#FAF3E2}
.acard .fm .ar{line-height:1.9;padding-bottom:4px}

.mxsvg{background:#E9B863;padding:0;overflow:hidden}
.mxsvg svg{border-radius:18px}
.spot .dot{filter:drop-shadow(0 2px 3px rgba(46,36,25,.35))}
.spot:focus,.spot:focus-visible{outline:none}

/* ===== 28 harf: maxraj joylari + harf tanlash ===== */
.spot .hit{fill:transparent}
.spot .ring{fill:none;stroke:var(--cd);stroke-width:3}
.spot .pt{filter:drop-shadow(0 2px 3px rgba(46,36,25,.35))}
.spot.sel .pt{fill:var(--cn);stroke:#FAF3E2}
.mxside{display:flex;flex-direction:column;gap:12px;min-width:0}
.zchips{display:flex;flex-wrap:wrap;gap:8px}
.zchip{min-height:48px;min-width:48px;padding:0 10px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);box-shadow:0 2px 0 var(--sandd);color:var(--ink0);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.zchip bdi.ar{font-size:30px;line-height:1.35;padding:0 3px}
.zchip.seen{background:#EADBB6}
.zchip.sel{background:var(--cn);border-color:#1F4A38;color:#FAF3E2;box-shadow:0 2px 0 #1F4A38}
.zchip:focus-visible,.tile:focus-visible{outline:3px solid var(--ink0);outline-offset:2px}
.mxinfo .lrow{display:flex;align-items:center;gap:12px;background:var(--cream);border:1.5px solid var(--sandd);border-radius:14px;padding:8px 12px}
.lrow .lbig{width:64px;height:64px;flex:none;color:var(--cd)}
.lrow .ltx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* --- o'yinga xos --- */
/* Sifat eshiklari - mobil (Telegram Mini App) qatlami. Faqat --mobil build'ga qo'shiladi. */
/* demo CSS'dagi .app qoidalari #app'ga hech qachon tushmagan (class yo'q): mobilda xuddi shu qoidalar #app'ga beriladi */

/* albom oynasi: xavfsiz maydon va ixcham sarlavha */

/* bosish maydonlari >= 44 px (mavjudlari 48+; zaxira) */

.stage,.wall,.fence{max-width:100%}
.ibtn,.btn,.door,.tile,.zchip,.opt{touch-action:manipulation}

.foot{padding-bottom:var(--sab)}

  .tile{height:80px}
  .tile .tl{width:48px;height:48px}
}

 var id=el.getAttribute('data-id');
 if(isRight(id))await good(el,id);else await bad(el,id);
}
var lastDoor=null;
async function good(el,id){
 var L=D.harflar[S.li],B=D.blok[S.bi],gate=B.tur==='darvoza';
 await moveTo(el);fx('open');el.classList.add('open');lastDoor=el;
 await wait(550);ex(hero,'h');hero.classList.add('hop');fx('ok');setTimeout(function(){hero.classList.remove('hop')},700*kf()+20);
 if(gate){
  el.disabled=true;el.classList.add('found');
  if(id!=='hech')S.found.push(id);
  var need=L.zid.length,left=need-S.found.length,txt;
  if(id==='hech')txt='To‘g‘ri! '+fmt('{h}',L)+' da ziddi yo‘q sifat yo‘q — demak «Hech qaysi».';
  else{var z=zid(id);txt='To‘g‘ri! '+fmt('{h}',L)+' da '+z.tarif+' bor — '+z.nom+'.'}
  if(id==='hech'||left===0){
   if(id!=='hech')txt+=' <b>Bu harfda '+need+' ta shunday sifat bor — hammasi topildi.</b>';
   showRes(true,txt,'Eshikdan o‘tish',proceed);
  }else{
   txt+=' <b>Bu harfda '+need+' ta shunday sifat bor — yana '+left+' tasini top.</b>';
   showRes(true,txt,'Davom etish',function(){resBox().innerHTML='';ex(hero,'n');S.busy=false});
  }
  return;
 }
 var last=S.bi===6,extra='';
 if(last){extra='<div class="forms" aria-label="Harf shakllari">'+L.shakl.map(function(f,i){return '<div style="animation-delay:'+(i*.12)+'s"><span class="ar" aria-hidden="true">'+f[1]+'</span><small>'+f[0]+'</small></div>'}).join('')+'</div>'}
 showRes(true,'To‘g‘ri! '+fmt(L.izoh[B.id].t,L),last?'Kartani yig‘ish':'Eshikdan o‘tish',last?finishLetter:proceed,extra);
}
async function enterDoor(){
 if(!lastDoor)return;
 var st=$('#stage'),sr=st.getBoundingClientRect(),dr=lastDoor.getBoundingClientRect(),hr=hero.getBoundingClientRect();
 hero.classList.add('walk');hero.classList.remove('idle');
 hero.style.transform='translateY(-'+Math.max(30,Math.round(hr.bottom-dr.bottom+hr.height*.25))+'px) scale(.42)';hero.style.opacity='0';
 await wait(900);
}
async function proceed(){S.busy=true;await enterDoor();S.bi++;go('road')}
async function finishLetter(){
 S.busy=true;await enterDoor();
 var was=S.done.indexOf(S.li)>-1;if(!was)S.done.push(S.li);save();
 var L=D.harflar[S.li],b=$('#bAct'),ab=$('#bAlbum');
 var f=document.createElement('div');f.className='fly';var r=(b||ab).getBoundingClientRect();
 f.innerHTML='<div class="acard" style="padding:8px 14px"><div class="letter" style="width:64px;height:64px;box-shadow:none;color:#8F3C12">'+letterSVG(L)+'</div></div>';
 f.style.left=r.left+'px';f.style.top=(r.top-40)+'px';document.body.appendChild(f);void f.offsetWidth;fx('card');
 var t=ab.getBoundingClientRect();f.style.left=(t.left+t.width/2-30)+'px';f.style.top=(t.top)+'px';f.style.transform='scale(.35)';f.style.opacity='.4';
 await wait(850);f.remove();top();var nb=$('#bAlbum');if(nb)nb.classList.add('bump');await wait(450);
 if(!was&&S.done.length>=N){S.finished=true;var s=stars();if(s>S.best)S.best=s;save();go('end')}else go('pick')
}
function pitPlace(){
 var st=$('#stage'),pit=$('#pit'),hw=hero.offsetWidth,w=Math.round(hw*1.5);
 pit.style.width=w+'px';pit.style.height=Math.round(hw*.5)+'px';pit.style.left=(parseFloat(hero.style.left)+hw/2-w/2)+'px';pit.style.bottom=Math.round(hw*.02)+'px';
}
function puff(){
 var st=$('#stage'),hw=hero.offsetWidth,cx=parseFloat(hero.style.left)+hw/2,els=[];
 for(var i=0;i<9;i++){var p=document.createElement('i');p.className='puff';var s=16+Math.round(Math.random()*18);p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(cx-s/2+(i-4)*7)+'px;bottom:'+(hw*.1)+'px;--px:'+((i-4)*13)+'px;--py:-'+(14+Math.round(Math.random()*42))+'px;animation-delay:'+(i*.02)+'s';st.appendChild(p);void p.offsetWidth;p.classList.add('go');els.push(p)}
 var tx=document.createElement('div');tx.className='pufftx';tx.textContent='puf!';tx.style.cssText='left:'+(cx-24)+'px;bottom:'+(hw*.55)+'px';st.appendChild(tx);els.push(tx);
 setTimeout(function(){els.forEach(function(e){e.remove()})},1300*kf()+60);
}
function sparks(){
 var st=$('#stage'),hw=hero.offsetWidth,cx=parseFloat(hero.style.left)+hw/2,els=[];
 for(var i=0;i<10;i++){var p=document.createElement('i');p.className='spark';var a=i/10*6.283;p.style.cssText='left:'+(cx-7)+'px;bottom:'+(hw*.55)+'px;--px:'+Math.round(Math.cos(a)*hw*.7)+'px;--py:'+Math.round(-Math.sin(a)*hw*.7)+'px;animation-delay:'+(i*.03)+'s;background:'+(i%2?'#F2B766':'#E2793F');st.appendChild(p);void p.offsetWidth;p.classList.add('go');els.push(p)}
 setTimeout(function(){els.forEach(function(e){e.remove()})},1100*kf()+60);
}
function reason(id){
 var L=D.harflar[S.li],B=D.blok[S.bi];
 if(B.tur==='darvoza'){
  if(id==='hech')return fmt('{h}',L)+' da ziddi yo‘q sifat bor — «Hech qaysi» emas. Harfni sukun bilan ayting va yaxshilab quloq soling.';
  var z=zid(id);return z.nom+' faqat '+ar(z.harf)+' harflarida bo‘ladi. '+fmt('{h}',L)+' da u yo‘q.';
 }
 return fmt(L.izoh[B.id][id]||'Bu eshik noto‘g‘ri.',L);
}
async function bad(el,id){
 var L=D.harflar[S.li];
 await moveTo(el);ex(hero,'s');el.classList.add('shake');await wait(500);el.classList.remove('shake');
 pitPlace();var pit=$('#pit');fx('fall');pit.classList.add('on');await wait(420);
 hero.classList.add('cut');hin.style.transform='translateY(calc(var(--hw)*1.5))';await wait(650);
 ex(hero,'d');fx('puff');puff();await wait(400);
 hin.style.transform='translateY(calc(var(--hw)*.62))';await wait(450);
 S.hearts--;S.lost++;save();top();var hs=$$('.hearts svg');if(hs[S.hearts])hs[S.hearts].classList.add('pop');
 var why=reason(id);
 if(S.hearts>0)showRes(false,'<b>Tuzoq!</b> '+why,'Tirilish',revive);
 else showRes(false,'<b>Tuzoq!</b> '+why+'<br><b>Harf yo‘ldan qoldi.</b> Bu harf boshidan boshlanadi (oldingi harflar saqlanadi).','Shu harfni boshidan',function(){S.busy=true;go('birth')});
}
async function revive(){
 sparks();fx('revive');ex(hero,'n');hin.style.transform='translateY(0)';await wait(650);
 hero.classList.remove('cut');hero.classList.add('hop');$('#pit').classList.remove('on');
 setTimeout(function(){hero.classList.remove('hop')},700*kf()+20);
 resBox().innerHTML='';S.busy=false;
}
/* ---------- albom ---------- */
function cardHTML(i){
 var L=D.harflar[i],j=L.javob,ch=['hams','shid','ist','itb','izl'].map(function(k){return '<span>'+NOM[j[k]]+'</span>'}).join('');
 var z=L.zid.length?L.zid.map(function(x){return '<span class="g">'+zid(x).nom+'</span>'}).join(''):'<span class="g">Ziddi yo‘q: yo‘q</span>';
 return '<div class="acard"><span class="tape" style="position:absolute;top:-10px;left:50%;margin-left:-36px;width:72px;height:20px;background:color-mix(in srgb,var(--c) 58%,transparent);transform:rotate(-2deg)"></span>'+
 '<div class="letter">'+letterSVG(L)+'</div><div class="mj"><b>Maxraj:</b> '+L.maxraj.nom+'</div>'+
 '<div class="chips" aria-label="Sifatlar">'+ch+'</div><div class="chips">'+z+'</div>'+
 '<div class="chips"><span>'+NOM[j.sax]+'</span></div><div class="fm">'+L.shakl.slice().reverse().map(function(f){return '<span class="ar" aria-hidden="true">'+f[1]+'</span>'}).join('')+'</div>'+
 '<button class="btn sm sec snd" data-k="'+L.soz.klip+'">'+ico('volume-2')+' '+ar(L.soz.ar)+'</button></div>';
}
var lastFocus=null;
function openAlbum(){
 var ov=$('#ov');lastFocus=document.activeElement;
 var cards=D.harflar.map(function(L,i){return S.done.indexOf(i)>-1?cardHTML(i):'<div class="acard empty">'+ico('lock')+'&nbsp;'+D.harflar[i].ar+' — hali yo‘lda</div>'}).join('');
 ov.innerHTML='<div class="albom" role="dialog" aria-modal="true" aria-label="Harflar albomi"><div class="head"><h2>Harflar albomi <small class="ac">'+S.done.length+' / '+N+'</small></h2><button class="ibtn" id="bClose" aria-label="Yopish">'+ico('x')+'</button></div><div class="cards">'+cards+'</div></div>';
 ov.hidden=false;
 $('#bClose').onclick=closeAlbum;$('#bClose').focus();
 $$('.snd',ov).forEach(function(b){b.onclick=function(){play(b.getAttribute('data-k'))}});
}
function closeAlbum(){var ov=$('#ov');ov.hidden=true;ov.innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
/* ---------- harf tanlash ---------- */
function nextIdx(){for(var i=0;i<N;i++)if(S.done.indexOf(i)<0)return i;return -1}
function pickScr(){
 var nx=nextIdx(),d=document.createElement('section');d.className='screen pick';
 var tiles=D.harflar.map(function(L,i){var dn=S.done.indexOf(i)>-1;
  return '<button class="tile'+(dn?' done':'')+(i===nx?' next':'')+'" data-i="'+i+'" aria-label="'+(i+1)+'-harf'+(dn?', o‘tilgan':'')+(i===nx?', keyingi':'')+'"><span class="tl">'+letterSVG(L)+'</span><small>'+(i+1)+'</small>'+(dn?ico('check','ck'):'')+'</button>'}).join('');
 d.innerHTML='<div class="card"><span class="tape"></span><h2>Harfni tanlang</h2><p class="muted">Kurs tartibida '+N+' ta harf. O‘tilganlari belgilanadi — istalgan harfdan boshlash mumkin.</p>'+
  '<div class="pcount"><b>'+S.done.length+' / '+N+'</b><span class="bar" aria-hidden="true"><i style="width:'+Math.round(S.done.length/N*100)+'%"></i></span></div>'+
  '<div class="tiles" role="group" aria-label="Harflar">'+tiles+'</div>'+
  '<div class="row c">'+(nx>-1?'<button class="btn" id="bNx">Keyingi harf: '+ar(D.harflar[nx].ar)+' '+ico('arrow-right')+'</button>':'<button class="btn" id="bFin">'+ico('trophy')+' Yakunni ko‘rish</button>')+'</div></div>';
 main.appendChild(d);
 $$('.tile',d).forEach(function(b){b.onclick=function(){ctx();S.li=+b.getAttribute('data-i');go('birth')}});
 var bn=$('#bNx'),bf=$('#bFin');
 if(bn)bn.onclick=function(){ctx();S.li=nx;go('birth')};
 if(bf)bf.onclick=function(){go('end')};
 var t=$('.tile.next',d);if(t&&S.done.length)try{t.scrollIntoView({block:'nearest'})}catch(e){}
}
/* ---------- yakun ---------- */
function stars(){return S.lost<=10?3:S.lost<=25?2:1}
function endScr(){
 var n=stars(),d=document.createElement('section');d.className='screen fin-scr';
 d.innerHTML='<div class="card lostbox"><span class="tape"></span><h1 style="font-size:clamp(42px,8vw,64px)">Yo‘l tugadi!</h1><div class="stars" role="img" aria-label="'+n+' yulduz">'+[1,2,3].map(function(i){return ico('star',i<=n?'on':'').replace('class="ic ','style="animation-delay:'+(i*.35)+'s" class="ic ')}).join('')+'</div>'+
 '<p>Hamma '+N+' harf sifatlari bilan yo‘lni bosib o‘tdi. Yo‘qotilgan tirilish haqlari: <b>'+S.lost+'</b>.</p><div class="mini-cards">'+D.harflar.map(function(L){return '<div class="letter">'+letterSVG(L)+'</div>'}).join('')+'</div>'+
 '<p class="muted">Eng yaxshi natija: '+S.best+' / 3 yulduz. Harflar albomi hamma kartalar bilan to‘ldi.</p>'+
 '<div class="row c"><button class="btn" id="bAgain">'+ico('rotate-ccw')+' Qayta o‘ynash</button><button class="btn sec" id="bHard">'+ico('trophy')+' Qiyin rejim</button></div></div>';
 main.appendChild(d);
 for(var i=1;i<=n;i++)setTimeout(function(){fx('star')},i*350*kf());
 function restart(h){S.hard=h;S.li=0;S.bi=0;S.lost=0;S.done=[];S.finished=false;S.hearts=3;save();go('pick')}
 $('#bAgain').onclick=function(){restart(false)};$('#bHard').onclick=function(){restart(true)};
}
/* ---------- boshlash ---------- */
function init(){
 load();setK();
 app=$('#app');app.innerHTML=topHTML()+'<main id="main"></main><footer class="foot">'+D.brend+'</footer><div class="ov" id="ov" hidden></div>';
 main=$('#main');wireTop();
 var ov=$('#ov');ov.addEventListener('click',function(e){if(e.target===ov)closeAlbum()});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.hidden)closeAlbum()});
 window.__oyin={S:S,go:go,D:D};
 go('intro');
}
init();
})();
</script>
<script>/* Sifat eshiklari - mobil qatlam (haptic, orqaga, natija). O'yin IIFE ichida: holatni window.__oyin.S va DOM orqali o'qiymiz. */
(function(){
'use strict';
var M=window.MOBIL; if(!M||!window.__oyin)return;
var O=window.__oyin,S=O.S,D=O.D,N=D.harflar.length;
function $(s){return document.querySelector(s)}
function hap(k){try{M.hap(k)}catch(e){}}
/* --- haptic: to'g'ri / xato / tegish --- */
var seenRes=null;
function resCheck(){
 var r=$('#resBox .res');
 if(r===seenRes)return; seenRes=r;
 if(!r)return;
 if(r.classList.contains('ok'))hap('ok');
 else if(r.classList.contains('no'))hap(S.hearts<=0?'big':'err');
}
var rb=null;
function wireRes(){var b=$('#resBox');if(b&&b!==rb){rb=b;seenRes=null;new MutationObserver(resCheck).observe(b,{childList:true})}}
var lastIz=null;
function izCheck(){
 var z=$('#qiz .iz');if(z===lastIz)return;lastIz=z;
 if(z)hap(z.classList.contains('no')?'err':'ok');
}
/* --- ekran o'zgarishi: natija --- */
var lastDone=S.done.length,reported=false;
function screenCheck(){
 wireRes();izCheck();
 var sc=document.body.className;
 if(sc==='s-end'&&!reported){
  reported=true;
  var n=document.querySelectorAll('.stars svg.on').length||1;
  M.natija({yulduz:Math.max(1,Math.min(3,n)),ball:S.done.length,jami:N,tugadi:true});
  hap('big');
 }else if(sc!=='s-end')reported=false;
 if(S.done.length!==lastDone){
  if(S.done.length>lastDone&&S.screen!=='end'){hap('big');M.natija({yulduz:0,ball:S.done.length,jami:N,tugadi:false})}
  lastDone=S.done.length;
 }
}
new MutationObserver(screenCheck).observe(document.body,{attributes:true,attributeFilter:['class'],childList:false});
new MutationObserver(function(){wireRes();izCheck();if(S.done.length!==lastDone)screenCheck()}).observe(document.getElementById('main'),{childList:true,subtree:true});
var topEl=document.getElementById('app');
new MutationObserver(function(){if(S.done.length!==lastDone)screenCheck()}).observe(topEl,{childList:true,subtree:true});
/* tegish: eshik/plitka/chip/variant */
document.addEventListener('click',function(e){
 var t=e.target.closest&&e.target.closest('.tile,.zchip,.door,.opt,.ibtn,.btn');
 if(!t||t.disabled)return;
 hap(t.matches('.door,.opt')?'light':'sel');
},true);
/* --- orqaga tugmasi --- */
M.setBack(function(){
 var ov=$('#ov');
 if(ov&&!ov.hidden){var c=$('#bClose');if(c)c.click();return true}
 var sc=S.screen;
 if(sc==='intro')return false;
 if(sc==='road'&&S.busy&&!$('#resBox .res'))return true;      /* eshik animatsiyasi ketyapti */
 if(sc==='road'||sc==='birth'){O.go('pick');return true}
 if(sc==='prep'){if(S.prepStep>0){S.prepStep--;O.go('prep')}else O.go('intro');return true}
 O.go('intro');return true;                                  /* pick, end */
});
wireRes();
})();
</script></body>
</html>
