<style>/* Rezina harf — fonetika v6 Montessori (qog'oz, tape, yumshoq soya). Tokenlar: Sifat eshiklari bilan bir xil. */
:root{
 --bg:#F3EAD5;--ink:#45382A;--ink2:#6A5A45;--ink0:#2E2419;--cream:#FAF3E2;--sand:#DCCBA5;--sandd:#C4AE83;--hl:#A64A28;--cn:#2F6B52;--cnl:#CFE3D3;--cnd:#1F4A38;
 --c:#E2793F;--cd:#8F3C12;--cl:#F5C9A8;--paper:#FBF5E6;--wood:#B98B55;--woodd:#8E6738;--woodl:#CFA46C;
 --fh:'Caveat','Segoe Script',cursive;--fb:'Lora',Georgia,serif;--far:'Madina','Sakkal Majalla','Noto Naskh Arabic',serif;
 --sh:0 2px 8px rgba(70,50,30,.2);--sh2:0 6px 18px rgba(70,50,30,.22);--k:1;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
[hidden]{display:none!important}
.ar{font-family:var(--far);font-weight:400;direction:rtl;unicode-bidi:isolate;line-height:1.7}
bdi.ar{font-size:1.28em;line-height:1.2}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cn);outline-offset:3px;border-radius:6px}
.app{max-width:980px;margin:0 auto;padding:8px 16px 24px;min-height:100vh;display:flex;flex-direction:column;gap:10px}

/* yuqori qator */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:48px}
.brand{font:700 24px/1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.hud{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--sandd);background:var(--cream);font:700 19px/1 var(--fh);color:var(--ink2);box-shadow:var(--sh)}
.ibtn{min-width:44px;min-height:44px;border-radius:14px;border:2px solid var(--sandd);background:var(--cream);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:#fff6e0}

/* kartalar */
.card{position:relative;background:var(--paper);border-radius:14px 20px 14px 18px;box-shadow:var(--sh2);padding:22px 22px 20px;border:1px solid rgba(196,174,131,.6)}
.card .tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-2.5deg);background:color-mix(in srgb,var(--c) 58%,transparent);box-shadow:0 1px 2px rgba(70,50,30,.2);clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0)}
h1,h2{font:700 44px/1.05 var(--fh);margin:0 0 6px;color:var(--cd)}
h2{font-size:34px}
p{margin:0 0 10px}
.mut{color:var(--ink2);font-size:15px}
.btn{min-height:52px;padding:10px 24px;border:0;border-radius:16px;background:var(--c);color:var(--ink0);font:700 22px/1.1 var(--fh);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 var(--cd),var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform calc(.12s*var(--k)),box-shadow calc(.12s*var(--k))}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cd)}
.btn.sec{background:var(--cream);box-shadow:0 3px 0 var(--sandd),var(--sh);border:2px solid var(--sandd)}
.btn.sm{min-height:46px;padding:6px 16px;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}

/* kirish */
.demo3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 8px}
.dm{background:var(--cream);border:2px solid var(--sandd);border-radius:14px;padding:10px 10px 8px;text-align:center}
.dm svg{display:block;width:100%;height:auto}
.dm .t{font:700 24px/1 var(--fh);color:var(--cd);margin-top:2px}
.dm .s{font-size:14px;color:var(--ink2);line-height:1.3}
.rules{margin:8px 0 14px;padding:0;list-style:none;display:grid;gap:6px}
.rules li{position:relative;padding-left:22px}
.rules li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:9px;background:var(--c);transform:rotate(45deg);border-radius:1px}

/* o'yin */
.prog{display:flex;align-items:center;gap:10px}
.prog .dots{display:flex;gap:6px;flex:1}
.prog .dots b{height:10px;flex:1;max-width:60px;border-radius:6px;background:var(--sand);border:1.5px solid var(--sandd);transition:background calc(.3s*var(--k))}
.prog .dots b.cur{background:var(--cl);border-color:var(--cd)}
.prog .dots b.ok{background:var(--c);border-color:var(--cd)}

/* ---------- ekran: kirish ---------- */
var MINI={xp:16,xr:56,px:55,y:35,th:11,r:12,s:0.5,pw:13,ph:32};
var loopId=0;
function miniLoops(){
 var id=++loopId,sv=$$('svg.mini',app),bs=sv.map(function(s){return new Band(s,MINI)});
 function frame(t){
  var a=t%2.4,u;
  if(a<0.2)u=0.7*(a/0.2);else if(a<1.0)u=spring(0.7,a-0.2);else u=0;
  bs[0].set(u,0,0);
  var b=t%3.6;
  if(b<1.0){var q=b/1.0;u=2*(q*q*(3-2*q))}else if(b<1.6)u=2;else if(b<2.4)u=spring(2,b-1.6);else u=0;
  bs[1].set(u,0,0);
  var c=t%4.0;
  if(c<1.9){u=3.5*(c/1.9);bs[2].set(u,Math.max(0,u-2.4)*3,t*30)}
  else if(c<2.6)bs[2].snapFrame((c-1.9)/0.7,3.5);
  else if(c<3.6)bs[2].snapFrame(1,3.5);else bs[2].set(0,0,0);
 }
 if(kf()<0.2){bs[0].set(0,0,0);bs[1].set(2,0,0);bs[2].snapFrame(0.55,3.5);return}
 var t0=performance.now();
 (function f(n){if(id!==loopId||!document.body.contains(sv[0]))return;frame((n-t0)/1000);requestAnimationFrame(f)})(t0);
}

/* ---------- ekran: bosqich ---------- */
function dots(){return ITEMS.map(function(_,i){var r=S.res[i],c=i===S.qi?'cur':(r.ok===true?'ok':(r.ok===false?'no':''));return '<b class="'+c+'"></b>'}).join('')}
function capText(it,g){
 if(g)return it.type==='S'?'Namuna qisqa: tugmani bosib, darrov qo‘yib yubor.':'Namuna uzun: tugmani ~2 harakat ushlab tur.';
 return 'Tingla, so‘ng harfni ushla: qisqami yoki uzun?';

function startRound(){
 var it=ITEMS[S.qi],g=S.qi<2;
 S.screen='play';S.phase='ready';S.tries=0;S.tok++;S.lastN=-1;loopId++;setAttr();
 app.innerHTML=topbar('<span class="chip" id="stepchip">'+(S.qi+1)+' / '+ITEMS.length+'</span>')+

 '<div class="right"><button class="hold'+(g?' hint':'')+'" id="hold" type="button" data-g="'+(g?1:0)+'" aria-label="Rezinani cho‘zish: bosib tur, qo‘yib yuborish uchun qo‘yib yubor"><span class="in">Bos va<br>ushla</span></button>'+
 '<button class="btn sec sm" type="button" data-act="listen">'+ico('volume-2')+'Tingla</button>'+
 '<div id="res" role="status" aria-live="polite"></div></div></div></section>'+foot();
 var sv=$('#bsv');S.band=new Band(sv,{xp:40,xr:100,px:135,y:56,th:20,r:23,s:1,pw:26,ph:62});
  paintWord(it,0);
 bindHold();
 play(it.id,$('[data-act=listen]'));
}
function paint(u){
 var it=ITEMS[S.qi],b=S.band,hold=$('#hold');
 var amp=u>2.4?(u-2.4)*4:0;
 b.set(u,amp,performance.now()*0.03);
 paintWord(it,u);
 $('#live').textContent=f1(Math.max(0,u))+' harakat';
 var p=$('#ptr'),sv=$('#bsv');if(p){p.setAttribute('visibility','visible');var px=Math.max(X(0),b.hx).toFixed(1);p.setAttribute('x1',px);p.setAttribute('x2',px)}
 hold.style.setProperty('--p',Math.min(1,u/SNAP).toFixed(3));
 if(hold.dataset.g==='1'||S.fk){hold.classList.toggle('z-s',u<=SMAX);hold.classList.toggle('z-l',u>=LMIN&&u<=LMAX);hold.classList.toggle('z-d',u>LMAX)}
}

/* ---------- bosib turish ---------- */
function bindHold(){
 var h=$('#hold');
 h.addEventListener('pointerdown',function(e){if(e.button>0)return;e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(_){}startHold()});
 h.addEventListener('pointerup',function(e){endHold(false)});
 h.addEventListener('pointercancel',function(){endHold(true)});
 h.addEventListener('lostpointercapture',function(){endHold(false)});
 h.addEventListener('contextmenu',function(e){e.preventDefault()});
 h.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')){e.preventDefault();if(!e.repeat)startHold()}});
 h.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();endHold(false)}});
 h.addEventListener('blur',function(){endHold(true)});
}
function startHold(){
 if(S.phase!=='ready')return;
 stopAudio();S.phase='holding';setAttr();S.t0=performance.now();
 var h=$('#hold');h.classList.add('on');h.classList.remove('hint');var rs=$('#res');rs.innerHTML='';rs.className='';rs.removeAttribute('data-kind');
 cancelAnimationFrame(S.raf);
 (function tick(n){
  if(S.phase!=='holding')return;
  var u=(n-S.t0)/UNIT;
  if(u>=SNAP){return doSnap()}
  paint(u);S.raf=requestAnimationFrame(tick);
 })(performance.now());
}
function endHold(cancel){
 if(S.phase!=='holding')return;
 cancelAnimationFrame(S.raf);
 var u=(performance.now()-S.t0)/UNIT,h=$('#hold');h.classList.remove('on');
 if(cancel){S.phase='busy';setAttr();var T=S.tok;anim(500,function(p){if(T!==S.tok)return;paint(spring(u,p*.9))},T).then(function(){if(T===S.tok){reset();S.phase='ready';setAttr()}});return}
 judge(u,false);
}
function reset(){S.band.set(0,0,0);S.lastN=-1;paintWord(ITEMS[S.qi],0);var h=$('#hold');h.style.setProperty('--p',0);h.classList.remove('z-s','z-l','z-d');$('#live').textContent='0,0 harakat';var p=$('#ptr');if(p)p.setAttribute('visibility','hidden')}
function doSnap(){
 S.phase='busy';setAttr();var T=S.tok,h=$('#hold');h.classList.remove('on');
 h.style.setProperty('--p',1);$('#live').textContent='uzildi!';
 var p=$('#ptr');if(p)p.setAttribute('visibility','hidden');
 judge(SNAP,true);
 anim(700,function(q){S.band.snapFrame(q,SNAP)},T);
}

/* ---------- baho ---------- */
function judge(u,snap){
 var it=ITEMS[S.qi],T=S.tok,kind,ok=false;
 if(snap)kind='snap';
 else if(it.type==='S'){ok=u<=SMAX;kind=ok?'ok':'long'}
 else{if(u<LMIN)kind='short';else if(u>LMAX)kind='over';else{ok=true;kind='ok'}}
 S.phase='busy';setAttr();S.tries++;S.res[S.qi].tries=S.tries;
 var final=ok||S.tries>=2;
 if(ok){S.res[S.qi].ok=true;S.res[S.qi].first=S.tries===1}
 else if(final)S.res[S.qi].ok=false;
 var d=$('#dots');if(d)d.innerHTML=dots();
 showResult(it,kind,u,ok,final);
 if(!snap){anim(900,function(p){if(T!==S.tok)return;paint(spring(u,p*.9))},T).then(function(){if(T!==S.tok)return;reset();finish()})}
 else{anim(1500,function(){},T).then(function(){if(T!==S.tok)return;reset();finish()})}
 function finish(){
  if(final){S.phase='done';var h=$('#hold');h.disabled=true;h.classList.remove('hint')}else S.phase='ready';
  setAttr();
 }
}
function showResult(it,kind,u,ok,final){
 var madl=it.m>=0?ar(it.p[it.m]):'',vn=VN[it.v],uz=it.type==='L';
 var t,p,icn=ok?'check':'rotate-ccw';
 if(kind==='ok'){t=ok&&S.tries===1?'To‘g‘ri!':'Endi to‘g‘ri!';p=uz?'«'+it.tr+'» — uzun unli: '+madl+' madd harfi. Rezina taxminan 2 harakat cho‘zildi ('+f1(u)+').':'«'+it.tr+'» — qisqa unli ('+vn+'). Rezinani tez qo‘yib yubording.'}
 else if(kind==='long'){t='Rezina ortiq cho‘zildi';p='Bu qisqa unli ('+vn+') — uni tez qo‘yib yubor. Sen '+f1(u)+' harakat ushlading.'}
 else if(kind==='short'){t='Rezina yetarlicha cho‘zilmadi';p='Bu yerda '+madl+' bor — uzun unli. Taxminan 2 harakat ushlab tur (sen '+f1(u)+' harakat ushlading).'}
 else if(kind==='over'){t='Biroz ortiq';p='2 harakatdan oshdi ('+f1(u)+'). 2 ga yetganda qo‘yib yubor — 3,5 da rezina uziladi.'}
 else{t='Rezina uzildi!';p=uz?'Uzun unlini ham cheksiz cho‘zib bo‘lmaydi: taxminan 2 harakatda qo‘yib yubor.':'Qisqa unlida rezinani umuman cho‘zma — tez qo‘yib yubor.'}
 if(!ok&&final)p+=' <b>To‘g‘ri javob:</b> '+(uz?'uzun, taxminan 2 harakat.':'qisqa, tez qo‘yib yuborish.');
 if(!ok&&!final)p+=' Namunani yana tingla va qayta urinib ko‘r.';
 var last=S.qi===ITEMS.length-1;
 var btn=final?'<div class="row"><button class="btn sm" type="button" data-act="next">'+(last?'Natijani ko‘r':'Keyingisi')+ico('arrow-right')+'</button></div>':'';
 var el=$('#res');el.className='res '+(ok?'ok':'no');el.dataset.kind=kind;
 el.innerHTML='<div class="t">'+ico(icn)+t+'</div><p>'+p+'</p>'+btn;
 if(final){reveal(it,ok)}
 if(ok||final)setTimeout(function(){if(S.screen==='play')play(it.id,$('[data-act=listen]'))},kf()<0.2?50:500);
 else setTimeout(function(){if(S.screen==='play'&&S.phase!=='holding')play(it.id,$('[data-act=listen]'))},kf()<0.2?50:600);
}
function reveal(it,ok){

/* ---------- yakun ---------- */
function showEnd(){

 var n=0,first=0;S.res.forEach(function(r){if(r.ok)n++;if(r.first)first++});

 '<div class="sum">'+cards+'</div><p class="mut" style="margin:0 0 10px">Kartani bossang, Muhammad Amin ovozidagi namuna eshitiladi.</p>'+
 '<ul class="rules"><li><b>Qisqa unli</b> (fatha, kasra, damma): rezina cho‘zilmaydi — taxminan 1 harakatdan oshmaydi.</li>'+
 '<li><b>Uzun unli</b> ('+ar('ا')+' '+ar('و')+' '+ar('ي')+'): rezina taxminan 2 harakat cho‘ziladi.</li>'+
 '<li><b>Ortiq cho‘zma:</b> uzun unlini ham taxminan 2 harakatda qo‘yib yubor — keyin rezina uziladi.</li></ul>'+
 '<div class="row c"><button class="btn" type="button" data-act="again">'+ico('rotate-ccw')+'Qayta o‘ynash</button><button class="btn sec" type="button" data-act="intro">Boshiga</button></div></section>'+foot();
}

app.addEventListener('click',function(e){

 if(a==='start'||a==='again'){S.qi=0;resetRes();startRound()}

<script>/* Rezina harf - mobil qatlam: haptic, natija, orqaga (DOM kuzatuvi; o'yin kodi o'zgarmaydi) */
(function(){
'use strict';
var M=window.MOBIL;if(!M)return;
var app=document.getElementById('app'),root=document.documentElement,doneKey=false;

/* haptic: ushlash boshlanishi */
document.addEventListener('pointerdown',function(e){var t=e.target;if(t&&t.closest&&t.closest('#hold')&&!t.closest('#hold[disabled]'))M.hap('light')},{capture:true,passive:true});

function onMut(list){

  if(!doneKey){
   doneKey=true;
   var m=(sc.textContent||'').match(/(\d+)\s*\/\s*(\d+)/);
   var n=m?+m[1]:0,j=m?+m[2]:8;
   M.natija({yulduz:n>=j?3:(n>=Math.ceil(j*0.75)?2:1),ball:n,jami:j,tugadi:true});
   M.hap(n>=Math.ceil(j*0.75)?'big':'ok');

}
if(app&&window.MutationObserver)new MutationObserver(onMut).observe(app,{childList:true,subtree:true});
/* orqaga: o'yin ichida chiqishni tasdiqlash oynasi */
var ov=null;

 ov.addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='stay')hideOv();else{hideOv();M.chiqish()}});
 document.body.appendChild(ov);M.hap('warn');
}
M.setBack(function(){
 if(ov){hideOv();return true}
 if(root.dataset.screen==='play'){showOv();return true}

});
M.onHidden(function(){/* o'yin o'zi: visibilitychange -> ovoz to'xtaydi, ushlash bekor */});
})();
