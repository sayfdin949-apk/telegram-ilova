<style>/* Aks-sado xonasi — fonetika v6 Montessori (qog'oz, tape, yumshoq soya). Tokenlar: Sifat eshiklari bilan bir xil. */
:root{
 --bg:#F3EAD5;--ink:#45382A;--ink2:#6A5A45;--ink0:#2E2419;--cream:#FAF3E2;--sand:#DCCBA5;--sandd:#C4AE83;--hl:#A64A28;--cn:#2F6B52;--cnl:#CFE3D3;--cnd:#1F4A38;
 --c:#E2793F;--cd:#8F3C12;--cl:#F5C9A8;--paper:#FBF5E6;--wood:#B98B55;--woodd:#8E6738;--woodl:#CFA46C;--wall:#EADBB6;--walld:#D9C698;
 --fh:'Caveat','Segoe Script',cursive;--fb:'Lora',Georgia,serif;--far:'Madina','Sakkal Majalla','Noto Naskh Arabic',serif;
 --sh:0 2px 8px rgba(70,50,30,.2);--sh2:0 6px 18px rgba(70,50,30,.22);--k:1;
 --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:var(--grain);color:var(--ink);font:500 17px/1.5 var(--fb);min-height:100vh;overflow-x:hidden}
[hidden]{display:none!important}
.ar{font-family:var(--far);font-weight:400;direction:rtl;unicode-bidi:isolate;line-height:1.7}
bdi.ar{font-size:1.28em;line-height:1.2}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cn);outline-offset:3px;border-radius:6px}
.app{max-width:980px;margin:0 auto;padding:8px 16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:10px}

/* yuqori qator */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:48px}
.brand{font:700 22px/1 var(--fh);color:var(--ink2);display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;grid-template-columns:repeat(3,1fr);width:20px;height:20px;place-items:center}
.brand i b{width:7px;height:7px;background:var(--c);transform:rotate(45deg);display:block;border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--sandd);background:var(--cream);font:700 18px/1 var(--fh);color:var(--ink2);box-shadow:var(--sh)}
.chip.ok{border-color:var(--cn);color:var(--cnd);background:var(--cnl)}
.chip.bad{border-color:var(--hl);color:var(--cd);background:var(--cl)}
.chip svg{width:18px;height:18px}

/* xona */
.room{position:relative;border-radius:18px;overflow:hidden;box-shadow:var(--sh2);border:2px solid var(--sandd);background:var(--wall);height:clamp(150px,27vh,215px);max-width:760px;width:100%;margin-inline:auto}
.room svg.rs{display:block;width:100%;height:100%}
.room .ripples{pointer-events:none}
.rip{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rip calc(1.7s*var(--k)) cubic-bezier(.2,.6,.3,1) forwards;opacity:0}
.rip.me{stroke:var(--cn)}.rip.ex{stroke:var(--c)}
@keyframes rip{0%{transform:scale(.05);opacity:.85}80%{opacity:.25}100%{transform:scale(1);opacity:0}}
.rip.back{animation-name:ripb}
@keyframes ripb{0%{transform:scale(1);opacity:0}15%{opacity:.7}100%{transform:scale(.18);opacity:0}}
.niche path.f{fill:var(--walld);stroke:var(--sandd);stroke-width:3;transition:fill calc(.5s*var(--k)),filter calc(.5s*var(--k))}
.niche.cur path.f{fill:#F2E3BE}
.niche.ok path.f{fill:var(--c);stroke:var(--cd)}
.niche.no path.f{fill:var(--cnl);stroke:var(--cn)}
.niche.ok{filter:drop-shadow(0 0 7px rgba(226,121,63,.7))}
.niche.glim path.f{animation:glim calc(.9s*var(--k))}
@keyframes glim{40%{fill:#F7C98F}}
.pedestal-l{transition:transform calc(.25s*var(--k))}
.room.hear .pedestal-l{animation:nod calc(.9s*var(--k)) ease-in-out infinite}
@keyframes nod{50%{transform:translateY(-5px)}}

/* kartalar */
.card{position:relative;background:var(--paper);border-radius:14px 20px 14px 18px;box-shadow:var(--sh2);padding:22px 22px 20px;border:1px solid rgba(196,174,131,.6)}
.card .tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;margin-left:-39px;transform:rotate(-2.5deg);background:color-mix(in srgb,var(--c) 58%,transparent);box-shadow:0 1px 2px rgba(70,50,30,.2);clip-path:polygon(0 0,3% 12%,0 25%,3% 38%,0 50%,3% 62%,0 75%,3% 88%,0 100%,100% 100%,97% 88%,100% 75%,97% 62%,100% 50%,97% 38%,100% 25%,97% 12%,100% 0)}
.card.g .tape{background:color-mix(in srgb,var(--cn) 50%,transparent)}
h1,h2{font:700 40px/1.05 var(--fh);margin:0 0 6px;color:var(--cd)}
h2{font-size:34px}
p{margin:0 0 10px}
.mut{color:var(--ink2);font-size:15px}
.btn{min-height:52px;padding:10px 24px;border:0;border-radius:16px;background:var(--c);color:var(--ink0);font:700 21px/1.1 var(--fh);letter-spacing:.02em;cursor:pointer;box-shadow:0 3px 0 var(--cd),var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform calc(.12s*var(--k)),box-shadow calc(.12s*var(--k))}

  '<p class="mut" style="margin:6px 0 0;display:flex;gap:6px;align-items:center">'+ico('shield-check')+'Yozuving faqat shu qurilmada qoladi — hech qayerga yuborilmaydi.</p>'
 }else{
  h+='<div class="row" style="margin-top:14px"><button id="hint" class="btn'+(S.heard?'':' hint')+'" type="button" data-act="play-ex">'+ico('volume-2')+'Namunani tingla</button>'+
  '<button class="btn sec" type="button" data-act="next-listen"'+(S.heard?'':' disabled')+'>'+(S.qi===S.queue.length-1?'Yakunlash':'Keyingisi')+ico('arrow-right')+'</button></div>'+
  '<div class="tip">'+tipHTML(it,null)+'</div><div class="status" role="status" aria-live="polite">'+(S.msg||'Mikrofonsiz rejim: faqat namunalarni tinglaysan.')+'</div>'}
 return h+'</section>'}
function tipHTML(it,extra){return '<div class="t">'+ico('info')+'Quloq sol</div>'+it.tips.join('. ')+'.'+(extra?' '+extra:'')}
function durHint(it){
 var a=S.ex.dur,b=S.me.dur,d=(b-a)/a;
 if(it.shid==='shiddah'&&d>0.25)return 'Sening yozuving namunadan uzunroq: Shiddah tovushi to‘xtaydi — tovushni qisqaroq to‘xtatib ko‘r.';
 if(it.shid==='roxova'&&d<-0.25)return 'Sening yozuving namunadan qisqaroq: Roxova tovushi oqadi — tovushni biroz oqizib ko‘r.';
 if(it.shid==='bayniyya'&&Math.abs(d)>0.25)return 'Bayniyya — o‘rtada: biroz cho‘ziladi, so‘ng to‘xtaydi. Namunaning cho‘zilishiga quloq sol.';
 return ''}
function readHTML(it){
 var a=S.ex.dur,b=S.me.dur,d=(b-a)/a,s;
 if(Math.abs(d)<=0.2)s='Davomiylik deyarli bir xil.';
 else s='Sening yozuving namunadan taxminan <b>'+Math.round(Math.abs(d)*100)+'% '+(d>0?'uzunroq':'qisqaroq')+'</b>.';
 var ta=trend(S.ex.pitch),tb=trend(S.me.pitch),p;
 if(!ta||!tb)p='Balandlik shaklini aniqlab bo‘lmadi (tovush jarangsiz yoki shovqin ko‘p) — bu normal, quloq asosiy hakam.';
 else if(ta===tb)p='Balandlik shakli: ikkalasida ham ovoz <b>'+ta+'</b>.';
 else p='Balandlik shakli: namunada ovoz <b>'+ta+'</b>, senda <b>'+tb+'</b>.';
 return '<b>'+f2(a)+'</b> namuna · <b>'+f2(b)+'</b> sen. '+s+'<br>'+p}
function cmpBody(it){
 var r=S.res[S.queue[S.qi]],tries=r.tries;
 var aria='Ovoz to‘lqini taqqoslash: namuna '+f2(S.ex.dur)+', sen '+f2(S.me.dur)+'.';
 return '<div class="cmp" style="margin-top:8px"><canvas id="cv" role="img" aria-label="'+aria+'" height="'+CH.H+'"></canvas>'+
 '<div class="row c" style="margin:10px 0 0"><button class="btn sm" type="button" data-act="play-cex">'+ico('volume-2')+'Namuna</button><button class="btn sm grn" type="button" data-act="play-cme">'+ico('volume-2')+'Sen</button><button class="btn sm sec" type="button" data-act="play-seq">'+ico('git-compare-arrows')+'Ketma-ket</button></div>'+
 '<div class="two"><div class="read">'+readHTML(it)+'<div class="mut" style="margin-top:4px">To‘lqin har biri o‘z balandligiga moslangan; balandlik chizig‘i faqat shaklni solishtiradi, to‘g‘rilik o‘lchovi emas.</div></div>'+
 '<div class="tip">'+tipHTML(it,durHint(it))+'</div></div>'+
 '<div class="ask"><div class="q">O‘xshadimi?</div><button class="btn grn" type="button" data-act="same">'+ico('check')+'O‘xshadi</button><button class="btn sec" type="button" data-act="again">'+ico('rotate-ccw')+'Yana urinaman</button>'+
 (tries>=1?'<button class="btn sec sm" type="button" data-act="skip">Keyingisi'+ico('arrow-right')+'</button>':'')+'</div></div>'}
function sEnd(){
 var q=S.queue,ok=q.filter(function(i){return S.res[i].ok===true}).length,all=S.mode==='mic';
 var tiles=q.map(function(i){var r=S.res[i];return '<div class="it'+(r.ok===true?' ok':'')+'"><div class="a ar" lang="ar" dir="rtl">'+ITEMS[i].syl+'</div><div class="s">'+(all?(r.ok===true?'o‘xshadi':'yana mashq qilamiz'):'tinglandi')+'</div></div>'}).join('');
 var h='<section class="card stage"><span class="tape"></span>';
 if(all){h+='<h2>Aks-sado xonasi seni eshitdi</h2><div class="score">'+ok+' <small>/ '+q.length+' ta o‘xshadi</small></div><p class="mut" style="margin:0">Baho emas: bu — o‘zingni tekshirish. Yonib turgan o‘yiqlar sen «o‘xshadi» degan bo‘g‘inlar.</p>'}
 else h+='<h2>'+q.length+' ta bo‘g‘in tinglandi</h2><p class="mut">Endi mikrofon bilan o‘zingni ham sinab ko‘r: ikkala ovozni yonma-yon ko‘rasan.</p>';
 h+='<div class="sum">'+tiles+'</div><div class="row">';
 if(all&&ok<q.length)h+='<button class="btn" type="button" data-act="hard">'+ico('rotate-ccw')+'Mashq kerak bo‘lganlarni takrorlash</button>';
 if(!all)h+='<button class="btn" type="button" data-act="start-mic">'+ico('mic')+'Mikrofon bilan sinash</button>';
 h+='<button class="btn sec" type="button" data-act="restart">Boshidan</button></div></section>';return h}

var MAIN=null;
function render(){
 if(!MAIN)return;stopPlay();clearInterval(ripT);cancelAnimationFrame(phRAF);
 var h=S.screen==='intro'?sIntro():(S.screen==='micstate'?sMicState():(S.screen==='end'?sEnd():sItem()));
 MAIN.innerHTML=h;setNiches();setLetter();
 if(S.screen==='item'&&S.phase==='cmp'){var cv=$('#cv');requestAnimationFrame(function(){drawChart(null)})}
 var cs=$('#chip');if(cs){var m=S.mode==='listen'?['','Faqat tinglash','ear']:(S.mic==='ok'?['ok','Mikrofon yoqilgan','mic']:((S.mic==='denied'||S.mic==='none'||S.mic==='busy')?['bad','Mikrofon yo‘q','mic-off']:['','Mikrofon: so‘ralmagan','mic']));
  cs.className='chip '+m[0];cs.innerHTML=ico(m[2])+'<span>'+m[1]+'</span>'}}
function goItem(q){S.qi=q;S.phase='listen';S.me=null;S.heard=false;S.msg='';S.screen='item';render();getEx(ITEMS[S.queue[q]]).then(function(o){S.ex=o}).catch(function(){})}
function begin(mode){S.mode=mode;S.queue=ITEMS.map(function(_,i){return i});ITEMS.forEach(function(_,i){S.res[i]={ok:null,tries:0}});prep();goItem(0)}
function next(){var last=S.qi>=S.queue.length-1;if(last){closeMic();S.screen='end';render();var ok=S.queue.filter(function(i){return S.res[i].ok===true}).length;if(S.mode==='mic'&&ok>0){ripple('ex',1)}}else goItem(S.qi+1)}

document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.getAttribute('data-act');
 getAC();
 if(a==='start-mic'){S.mode='mic';ensureMic().then(function(r){if(r==='ok')begin('mic');else{S.screen='micstate';render()}});}
 else if(a==='retry-mic'){ensureMic().then(function(r){if(r==='ok')begin('mic');else{S.screen='micstate';render()}})}
 else if(a==='start-listen'){begin('listen')}
 else if(a==='play-ex'){playExOnly()}
 else if(a==='rec'){S.msg='';startRec()}
 else if(a==='stop'){stopRec()}
 else if(a==='play-cex'){playWho('ex')}
 else if(a==='play-cme'){playWho('me')}
 else if(a==='play-seq'){playWho('ex',true)}
 else if(a==='next-listen'){next()}
 else if(a==='same'){var ix=S.queue[S.qi];S.res[ix].ok=true;setNiches();chime(true);ripple('ex',1);setTimeout(next,700*kf()+60)}
 else if(a==='again'){S.res[S.queue[S.qi]].tries++;S.phase='listen';S.me=null;S.msg='Yana bir bor: avval namunani tingla, keyin ayt.';render()}
 else if(a==='skip'){S.res[S.queue[S.qi]].ok=false;chime(false);next()}
 else if(a==='hard'){var hq=S.queue.filter(function(i){return S.res[i].ok!==true});hq.forEach(function(i){S.res[i]={ok:null,tries:0}});S.queue=hq;S.mode='mic';ensureMic().then(function(r){if(r==='ok')goItem(0);else{S.screen='micstate';render()}})}
 else if(a==='restart'){S.mode='mic';S.screen='intro';ITEMS.forEach(function(_,i){S.res[i]={ok:null,tries:0}});S.queue=[];render()}
});
window.addEventListener('resize',function(){if(S.screen==='item'&&S.phase==='cmp')drawChart(null)});
window.addEventListener('pagehide',closeMic);

function init(){
 var app=$('#app');
 app.innerHTML='<div class="top"><div class="brand"><i aria-hidden="true"><b></b><b></b><b></b></i><span>Muhammad Amin · Fonetika kursi</span></div><span id="chip" class="chip" role="status"></span></div>'+
 '<div class="room" id="room">'+roomSVG()+'</div><main id="st"></main><div class="foot">Demo · namuna ovozlari — Muhammad Amin yozuvi</div>';
 MAIN=$('#st');render();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(S.screen==='item'&&S.phase==='cmp')drawChart(null)})}
window.__mobilAks={back:function(){if(S.screen==='intro')return false;if(R){R.stopped=true;cancelAnimationFrame(R.raf);try{R.mr.onstop=null;R.mr.stop()}catch(e){}try{R.src.disconnect()}catch(e){}R=null}closeMic();stopPlay();clearInterval(ripT);S.mode='mic';S.screen='intro';ITEMS.forEach(function(_,i){S.res[i]={ok:null,tries:0}});S.queue=[];render();return true},pause:function(){stopPlay();clearInterval(ripT);if(R)stopRec()}};
init();
})();
</script>
<script>/* Aks-sado xonasi - mobil ilgaklar: haptic, natija, orqaga, fonga o'tish (o'yin kodiga tegmaydi, DOMni kuzatadi) */
(function () {
  'use strict';
  var M = window.MOBIL; if (!M) return;
  var HAP = { 'same': 'ok', 'again': 'warn', 'skip': 'err', 'rec': 'big', 'stop': 'light', 'hard': 'sel', 'restart': 'sel',
    'start-mic': 'sel', 'start-listen': 'sel', 'retry-mic': 'sel', 'play-ex': 'light', 'play-cex': 'light', 'play-cme': 'light',
    'play-seq': 'light', 'next-listen': 'sel' };
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest && e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var k = HAP[b.getAttribute('data-act')]; if (k) M.hap(k);
  }, true);

  /* orqaga: o'yin ichida bo'lsa boshlang'ich ekranga, aks holda hubga */
  M.setBack(function () { var h = window.__mobilAks; try { return !!(h && h.back()); } catch (e) { return false; } });
  M.onHidden(function () { var h = window.__mobilAks; try { if (h) h.pause(); } catch (e) { } });

  /* natija: yakun ekrani paydo bo'lganda */
  var sentEnd = false, lastState = '';
  function watch() {
    var st = document.getElementById('st'); if (!st) return;
    var score = st.querySelector('.score'), sum = st.querySelector('.sum');
    var end = !!sum;
    if (!end) { sentEnd = false; }
    if (end && !sentEnd) {
      sentEnd = true;
      var ok = 0, tot = st.querySelectorAll('.sum .it').length;
      if (score) { ok = parseInt(score.textContent, 10) || 0; }
      else { ok = tot; }                                   /* faqat tinglash rejimi */
      var y = ok >= tot && tot ? 3 : ok >= Math.ceil(tot * 0.6) ? 2 : ok > 0 ? 1 : (score ? 0 : 1);
      if (score && y === 0) y = 0;
      M.natija({ yulduz: y, ball: ok, jami: tot, tugadi: true });
    }
    var s = st.querySelector('.state');                    /* mikrofon rad etildi */
    var key = s ? 'state' : '';
    if (key && lastState !== key) M.hap('warn');
    lastState = key;
  }
  function start() {
    var st = document.getElementById('st'); if (!st) { setTimeout(start, 100); return; }
    new MutationObserver(watch).observe(st, { childList: true });
    watch();
  }
  start();
})();
</script></body>
